name: Item 3 v9 driver v3 binding audit
# rerun after common source-map repair 2026-08-08

on:
  push:
    branches:
      - agent/item3-v9-analytic-proof
    paths:
      - "CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/rehearsal_driver_v9_candidate_v3.py"
      - "CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/test_rehearsal_driver_v3_binding.py"
      - ".github/workflows/item3-v9-driver-v3-binding-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/item3-v9-analytic-proof
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned validated arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Compile and run binding controls
        working-directory: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate
        run: |
          python -m py_compile rehearsal_driver_v9_candidate_v3.py test_rehearsal_driver_v3_binding.py
          python test_rehearsal_driver_v3_binding.py
      - name: Commit audit record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate
          if [ -f rehearsal_driver_v3_binding_audit.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- rehearsal_driver_v3_binding_audit.json
            if ! git diff --cached --quiet; then
              git diff --cached --check
              git commit -m "Record item3 v9 driver v3 binding audit"
              git push origin HEAD:agent/item3-v9-analytic-proof
            fi
          fi
