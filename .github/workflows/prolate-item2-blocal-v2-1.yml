name: Prolate item2 B-LOCAL v2.1

on:
  push:
    tags:
      - "blocal-v2.1-run-*"

permissions:
  contents: read

concurrency:
  group: prolate-item2-blocal-v2-1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  blocal:
    if: startsWith(github.ref, 'refs/tags/blocal-v2.1-run-')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Verify tag suffix equals commit SHA (pre-checkout)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          case "$GITHUB_REF" in
            refs/tags/blocal-v2.1-run-*) ;;
            *) exit 64 ;;
          esac
          TAG_SUFFIX="${GITHUB_REF#refs/tags/blocal-v2.1-run-}"
          printf '%s' "$TAG_SUFFIX" | grep -Eq '^[0-9a-f]{40}$'
          test "$TAG_SUFFIX" = "$GITHUB_SHA"

      - name: Checkout immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
          path: source

      - name: Verify checked-out HEAD equals commit SHA (post-checkout)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Independent byte and structure gate
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          case "$GITHUB_REF" in
            refs/tags/blocal-v2.1-run-*) ;;
            *) exit 64 ;;
          esac
          cat > "$RUNNER_TEMP/blocal-phase4-sha256.txt" <<'EOF'
          05cee1a25ee761631dfccde12ba9d06f6ff0a08b23b6f99d59a94121fa445bc7  CERTIFICATES/prolate/item2_circle/b_tube_v2_1/blocal_phase4_runner.py
          92bc9010cbaf7e3c61a79aa6bb05e2f717a99486e1faac416e0f3dd3ee5f327a  CERTIFICATES/prolate/item2_circle/b_tube_v2_1/blocal_phase4_model.py
          bfafb5ce31581817d9ba813c753a70f3b7e64c8812d53c1b54b55cf6b5a3b977  CERTIFICATES/prolate/item2_circle/b_tube_v2_1/blocal_phase4_provenance.py
          4e33e29e16a625b96584636a90171e3ce89a8827e49252b641678608afb448aa  CERTIFICATES/prolate/item2_circle/b_tube_v2_1/blocal_phase4_engine.py
          99e640fba88cfe353ea360190a03df7a9de8840637922f9f56fa6b7168d94e66  CERTIFICATES/prolate/item2_circle/b_tube_v2_1/blocal_arb_adapter.py
          8d75e694c560615e51643bdff4a4707d199444b16ae251e55fea8a8384ab7406  CERTIFICATES/prolate/item2_circle/b_tube_v2_1/blocal_phase4_static_test.py
          d70e9350de1ec98d7b373e13f629d31c0186379a4a8f365bf8c8c50ecd364c91  CERTIFICATES/prolate/item2_circle/b_tube_v2_1/config.blocal-run.json
          cd171f53dd8a187b2ef4bd7ad0cc2adbe2082395646c0c57407f4e3514c11f5c  CERTIFICATES/prolate/item2_circle/b_tube_v2_1/requirements.blocal-run.txt
          f13ac142c736065d23be548250d4624069d52f61be4f5428ea49e376ef85ec89  CERTIFICATES/prolate/item2_circle/b_tube_v2_1/BLOCAL_R1_ENDPOINT_ROUTE.md
          ab7112ae7ae570555d1add5c48adb72100562c71aff6b74c94883f58da0f495b  CERTIFICATES/prolate/item2_circle/b_tube_v2_1/dependencies/blocal-stage1-boundary-entry.zip
          da7e1554ca29344cd4d781cb3cc48a3581d1e3d36ca3ac7cf837d42fb313e37e  CERTIFICATES/prolate/item2_circle/b_tube_v2_1/config.blocal-stage1.json
          77e7a93c594ba66ac7d98df29ec3c03107b0c63962a5aa60f8503559082c10ac  CERTIFICATES/prolate/item2_circle/vendor/prolate_circle_F_cleanroom.py
          EOF
          sha256sum -c "$RUNNER_TEMP/blocal-phase4-sha256.txt"
          python CERTIFICATES/prolate/item2_circle/b_tube_v2_1/blocal_phase4_static_test.py

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install hash-pinned runtime dependency
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r CERTIFICATES/prolate/item2_circle/b_tube_v2_1/requirements.blocal-run.txt

      - name: Prepare fresh output workspace
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/blocal-output"
          test ! -e "$RUN_DIR"
          mkdir -m 700 "$RUN_DIR"
          rmdir "$RUN_DIR"

      - name: Execute separately authorized B-LOCAL run
        id: run
        working-directory: source
        shell: bash
        run: |
          set -uo pipefail
          RUN_DIR="$RUNNER_TEMP/blocal-output"
          python CERTIFICATES/prolate/item2_circle/b_tube_v2_1/blocal_phase4_runner.py \
            --config CERTIFICATES/prolate/item2_circle/b_tube_v2_1/config.blocal-run.json \
            --output-dir "$RUN_DIR"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          exit 0

      - name: Record output byte identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/blocal-output"
          test -f "$RUN_DIR/records.blocal.jsonl"
          test -f "$RUN_DIR/certificate.blocal.json"
          test -f "$RUN_DIR/run-summary.blocal.json"
          sha256sum \
            "$RUN_DIR/records.blocal.jsonl" \
            "$RUN_DIR/certificate.blocal.json" \
            "$RUN_DIR/run-summary.blocal.json" \
            > "$RUN_DIR/SHA256SUMS.txt"

      - name: Upload B-LOCAL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prolate-item2-blocal-v2-1-${{ github.sha }}
          path: ${{ runner.temp }}/blocal-output
          if-no-files-found: error
          retention-days: 30

      - name: Enforce complete terminal state
        if: always()
        shell: bash
        run: test "${{ steps.run.outputs.code }}" = "0"
