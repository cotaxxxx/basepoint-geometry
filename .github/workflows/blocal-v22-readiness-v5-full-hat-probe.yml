name: B-LOCAL v2.2 readiness v12.1 ratio-split F probe

on:
  push:
    branches: ["agent/blocal-v22-readiness-draft"]
    paths: [".github/workflows/blocal-v22-readiness-v5-full-hat-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    if: github.ref_name == 'agent/blocal-v22-readiness-draft'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    env:
      BLOCAL_DIR: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
      EPHEMERAL_CONFIG: CERTIFICATES/prolate/item2_circle/b_tube_v2_1/config.blocal-v2.2-readiness-ephemeral.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/blocal-v22-readiness-draft
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Guard
        run: |
          set -euo pipefail
          grep -qx 'config_materialized=false' "$BLOCAL_DIR/READINESS_DRAFT"
          grep -qx 'production_authorized=false' "$BLOCAL_DIR/READINESS_DRAFT"
          grep -qx 'tag_authorized=false' "$BLOCAL_DIR/READINESS_DRAFT"
      - name: Install Arb
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Ephemeral config
        run: |
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          h=Path("CERTIFICATES/prolate/item2_circle/b_tube_v2_1");sys.path.insert(0,str(h.resolve()))
          import blocal_v22_checker_test as ct, blocal_v22_model as m
          old=json.loads((h/"config.blocal-v2.2-run.json").read_text());c=ct.config()
          for k in ("stage1_dependency","kernel","adapter","base_v21","outputs"):c[k]=old[k]
          ns=["blocal_v22_policy.py","blocal_v22_model.py","blocal_v22_boundary.py","blocal_v22_checker.py","blocal_v22_checker_test.py","blocal_v22_runner.py","blocal_v22_static_test.py","blocal_v22_symbolic_audit.py","blocal_v22_readiness_test.py"];p="CERTIFICATES/prolate/item2_circle/b_tube_v2_1/";hs={p+n:hashlib.sha256((h/n).read_bytes()).hexdigest() for n in ns}
          c["implementation"]={"entrypoint_path":p+"blocal_v22_runner.py","sources_sha256":hs};c["checker"]={"id":m.CHECKER_ID,"path":p+"blocal_v22_checker.py","source_sha256":hs[p+"blocal_v22_checker.py"]};c["symbolic_audit"]={"id":m.SYMBOLIC_AUDIT_ID,"path":p+"blocal_v22_symbolic_audit.py","source_sha256":hs[p+"blocal_v22_symbolic_audit.py"]};m.validate_config(c);(h/"config.blocal-v2.2-readiness-ephemeral.json").write_bytes(m.canonical_json_bytes(c))
          PY
      - name: Static
        working-directory: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
        run: python blocal_v22_static_test.py
      - name: Apply structural floors gamma bracket and ratio-aware split
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("CERTIFICATES/prolate/item2_circle/b_tube_v2_1/diagnostics/blocal_v22_structural_D_probe_v8.py")
          s=p.read_text()
          old='''  if cell.region=="R1":\n   thi=p1/c0\n   af=coef/(1+thi*thi)\n   return af,{"A_floor":af,"B_floor":Fraction(0),"V2_floor":Fraction(0),"floor_source":"R1_AHAT"}\n'''
          new='''  if cell.region=="R1":\n   tlo=p0/c1;thi=p1/c0\n   af=coef/(1+thi*thi);bf=Fraction(0);vf=Fraction(0);sources=["R1_AHAT"]\n   sinc_lo=Fraction(1)-p1*p1/Fraction(6)\n   if sinc_lo>0 and tlo>0:\n    bf=tlo*tlo*sinc_lo*sinc_lo/(1+thi*thi);sources.append("B_SINC_TAYLOR")\n   if p0>=HALF_PI_HI:\n    rlo=Fraction(1)-u1;rho2hi=c1*c1+p1*p1\n    if rlo>0:\n     vf=rlo*rlo/rho2hi;sources.append("V_LARGE_PHI")\n   total=af+bf+vf\n   return total,{"A_floor":af,"B_floor":bf,"V2_floor":vf,"floor_source":"+".join(sources)}\n'''
          assert old in s;s=s.replace(old,new)
          assert 'val=-g["U"]*h-g["L"]*hp*M*y*z*z' in s
          s=s.replace('val=-g["U"]*h-g["L"]*hp*M*y*z*z','val=-g["U"]*h-hp*M*gamma*z*z')
          marker=' original=route._cell_eval\n'
          inject=''' eps_split=model.fraction_from_dyadic(cfg["geometry"]["eps"])\n def ratio_t_width(cell):\n  c0,c1,p0,p1=src(cell,eps_split)\n  if cell.region=="R1":return p1/c0-p0/c1\n  return c1/p0-c0/p1\n def split_ratio(cell):\n  am=(cell.a0+cell.a1)/2;bm=(cell.b0+cell.b1)/2\n  A=[route.Cell(cell.region,cell.path+"0",cell.depth+1,cell.a0,am,cell.b0,cell.b1),route.Cell(cell.region,cell.path+"1",cell.depth+1,am,cell.a1,cell.b0,cell.b1)]\n  B=[route.Cell(cell.region,cell.path+"0",cell.depth+1,cell.a0,cell.a1,cell.b0,bm),route.Cell(cell.region,cell.path+"1",cell.depth+1,cell.a0,cell.a1,bm,cell.b1)]\n  wa=max(ratio_t_width(x) for x in A);wb=max(ratio_t_width(x) for x in B)\n  return A if wa<=wb else B\n original_split=route._split\n route._split=lambda cell: split_ratio(cell) if cell.region in ("R1","R2") else original_split(cell)\n'''
          assert marker in s;s=s.replace(marker,inject+marker)
          p.write_text(s)
          PY
      - name: Ratio-aware F probe
        id: hat
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 1200s python "$BLOCAL_DIR/diagnostics/blocal_v22_structural_D_probe_v8.py" | tee /tmp/v121.json
      - name: Cleanup
        if: always()
        run: |
          rm -f "$EPHEMERAL_CONFIG"
          git checkout -- "$BLOCAL_DIR/diagnostics/blocal_v22_structural_D_probe_v8.py"
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HAT: ${{ steps.hat.outcome }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          ok=os.environ["HAT"]=="success";b=json.dumps({"state":"success" if ok else "failure","context":"blocal-v22-readiness-v12.1-ratio-split","description":"ratio_split_v12.1="+os.environ["HAT"],"target_url":f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode();r=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=b,method="POST",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","Content-Type":"application/json"});print(urllib.request.urlopen(r).read().decode())
          PY
      - name: Verdict
        if: always()
        run: test "${{ steps.hat.outcome }}" = success
