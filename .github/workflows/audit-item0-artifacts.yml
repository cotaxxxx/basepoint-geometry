name: Audit item 0 artifact inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/audit-item0-artifacts.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: item0-artifact-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export complete artifact inventory
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p item0_artifact_audit
          gh api --paginate "/repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | @json' > item0_artifact_audit/artifacts.jsonl
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          root = Path('item0_artifact_audit')
          records = [json.loads(line) for line in root.joinpath('artifacts.jsonl').read_text().splitlines() if line.strip()]
          start = datetime.fromisoformat('2026-07-23T00:00:00+00:00')
          end = datetime.fromisoformat('2026-07-27T00:00:00+00:00')
          dated = []
          for rec in records:
              created = datetime.fromisoformat(rec['created_at'].replace('Z', '+00:00'))
              if start <= created < end:
                  dated.append({k: rec.get(k) for k in ('id','name','size_in_bytes','created_at','updated_at','expired','workflow_run')})
          report = {
              'date_window_utc': [start.isoformat(), end.isoformat()],
              'total_artifacts_in_window': len(dated),
              'artifacts': dated,
          }
          root.joinpath('complete_inventory.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print('artifacts in window:', len(dated))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: item0-complete-artifact-inventory
          path: item0_artifact_audit/complete_inventory.json
