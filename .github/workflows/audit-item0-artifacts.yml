name: Audit item 0 artifact inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/audit-item0-artifacts.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: item0-artifact-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inventory candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p item0_artifact_audit
          gh api --paginate "/repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | @json' > item0_artifact_audit/artifacts.jsonl
          python - <<'PY'
          import json, re
          from datetime import datetime
          from pathlib import Path

          root = Path('item0_artifact_audit')
          records = [json.loads(line) for line in root.joinpath('artifacts.jsonl').read_text().splitlines() if line.strip()]
          start = datetime.fromisoformat('2026-07-23T00:00:00+00:00')
          end = datetime.fromisoformat('2026-07-27T00:00:00+00:00')
          dated = []
          for rec in records:
              created = datetime.fromisoformat(rec['created_at'].replace('Z', '+00:00'))
              if start <= created < end:
                  dated.append(rec)
          name_re = re.compile(r'(item[-_ ]?0|item0|0d|harvest|checkpoint|prolate|certif|kernel|interior)', re.I)
          candidates = [r for r in dated if name_re.search(r.get('name','')) and not r.get('expired', False)]
          report = {
              'date_window_utc': [start.isoformat(), end.isoformat()],
              'total_artifacts_in_window': len(dated),
              'candidate_count': len(candidates),
              'candidates': [{k:r.get(k) for k in ('id','name','size_in_bytes','created_at','expired')} for r in candidates],
          }
          root.joinpath('inventory.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: item0-artifact-inventory
          path: item0_artifact_audit/inventory.json
