name: Item 3 v9 driver canonical encoding fix

on:
  push:
    branches:
      - agent/item3-v9-analytic-proof
    paths:
      - ".github/workflows/item3-v9-driver-json-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/item3-v9-analytic-proof
          fetch-depth: 1
      - name: Patch canonical JSON helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/rehearsal_driver_v9_candidate.py")
          text=p.read_text(encoding="utf-8")
          old='return (json.dumps(obj, sort_keys=True, separators=(",", ":"), ensure_ascii=False) + "\\n").encode("utf-8")'
          new='return (json.dumps(encode_value(obj), sort_keys=True, separators=(",", ":"), ensure_ascii=False) + "\\n").encode("utf-8")'
          if text.count(old) != 1:
              raise SystemExit(f"unexpected canonical-json helper count: {text.count(old)}")
          p.write_text(text.replace(old,new,1),encoding="utf-8")
          PY
          python -m py_compile CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/rehearsal_driver_v9_candidate.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/rehearsal_driver_v9_candidate.py
          git diff --cached --check
          git commit -m "Fix item3 v9 driver canonical Fraction encoding"
          git push origin HEAD:agent/item3-v9-analytic-proof
