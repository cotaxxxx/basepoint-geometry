name: Prolate item 6 pole second-boundary certificate

on:
  pull_request:
    paths:
      - ".github/workflows/prolate-item6-pole-second-boundary.yml"
  workflow_dispatch:

concurrency:
  group: prolate-item6-pole-second-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pole-second-audit:
    name: pole-second-symbolic-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install symbolic audit environment
        run: python -m pip install sympy==1.14.0
      - name: Verify corrected positive-branch boundary formulas
        working-directory: CERTIFICATES/prolate/item6_axis
        run: python prolate_axis_pole_second_boundary_symbolic_audit.py
      - name: Upload symbolic audit
        uses: actions/upload-artifact@v4
        with:
          name: prolate-item6-pole-second-boundary-symbolic-audit
          path: CERTIFICATES/prolate/item6_axis/prolate_axis_pole_second_boundary_symbolic_audit.json

  pole-second-boundary-block:
    name: pole-second-${{ matrix.lo }}-${{ matrix.hi }}
    needs: pole-second-audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - lo: 1
            hi: 2
          - lo: 2
            hi: 3
          - lo: 3
            hi: 4
          - lo: 4
            hi: 5
          - lo: 5
            hi: 6
          - lo: 6
            hi: 7
          - lo: 7
            hi: 8
          - lo: 8
            hi: 9
          - lo: 9
            hi: 10
          - lo: 10
            hi: 12
          - lo: 12
            hi: 16
          - lo: 16
            hi: 24
          - lo: 24
            hi: 36
          - lo: 36
            hi: 52
          - lo: 52
            hi: 72
          - lo: 72
            hi: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validated arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Certify negative boundary second derivative
        working-directory: CERTIFICATES/prolate/item6_axis
        run: >-
          python prolate_axis_pole_second_boundary_block_arb.py
          --dps 50
          --tolerance 1e-18
          --integration-depth 22
          --eval-limit 200000
          --max-split-depth 12
          --max-boxes 8192
          --lambda-lo ${{ matrix.lo }}
          --lambda-hi ${{ matrix.hi }}
          --json prolate_axis_pole_second_boundary_block_${{ matrix.lo }}_${{ matrix.hi }}.json
      - name: Upload pole second-boundary block certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prolate-item6-pole-second-boundary-block-${{ matrix.lo }}-${{ matrix.hi }}
          path: |
            CERTIFICATES/prolate/item6_axis/prolate_axis_pole_second_boundary_block_${{ matrix.lo }}_${{ matrix.hi }}.json
            CERTIFICATES/prolate/item6_axis/prolate_axis_pole_second_boundary_block_${{ matrix.lo }}_${{ matrix.hi }}.json.sha256

  combine:
    name: pole-second-boundary-combine-1-100
    needs: pole-second-boundary-block
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download all pole second-boundary blocks
        uses: actions/download-artifact@v4
        with:
          pattern: prolate-item6-pole-second-boundary-block-*
          path: CERTIFICATES/prolate/item6_axis/pole_second_outputs
          merge-multiple: true
      - name: Combine exact adjacent pole second-boundary blocks
        working-directory: CERTIFICATES/prolate/item6_axis
        run: >-
          python prolate_axis_pole_second_boundary_combine.py
          --pattern "pole_second_outputs/prolate_axis_pole_second_boundary_block_*.json"
          --expected-lo 1
          --expected-hi 100
          --json prolate_axis_pole_second_boundary_combined_1_100.json
      - name: Upload combined pole second-boundary certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prolate-item6-pole-second-boundary-combined-1-100
          path: |
            CERTIFICATES/prolate/item6_axis/prolate_axis_pole_second_boundary_combined_1_100.json
            CERTIFICATES/prolate/item6_axis/prolate_axis_pole_second_boundary_combined_1_100.json.sha256
