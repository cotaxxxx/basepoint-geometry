name: Prolate item 2 circle tube pilot

on:
  workflow_dispatch:

concurrency:
  group: prolate-item2-tube-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install python-flint==0.9.0
      - name: Compile drivers
        working-directory: CERTIFICATES/prolate/item2_circle
        run: python -m py_compile prolate_circle_seed.py prolate_circle_tube_pilot.py
      - name: Select kernels (real vendor or SELFTEST mock)
        working-directory: CERTIFICATES/prolate/item2_circle
        run: |
          if [ -f vendor/prolate_circle_kernels.py ]; then
            echo "MODE=REAL" >> "$GITHUB_ENV"
          else
            cp selftest/mock_kernels.py vendor/prolate_circle_kernels.py
            echo "MODE=SELFTEST" >> "$GITHUB_ENV"
            echo "::warning::vendor kernels absent - running harness SELFTEST (no mathematical content)"
          fi
      - name: B-SEED draft grid
        working-directory: CERTIFICATES/prolate/item2_circle
        run: python prolate_circle_seed.py
      - name: B-TUBE pilot (lambda in [5,6], 16 boxes)
        working-directory: CERTIFICATES/prolate/item2_circle
        run: |
          set +e
          python prolate_circle_tube_pilot.py --dps 35 --lam-lo 5 --lam-hi 6 \
            --lam-splits 16 --tube-num 1 --tube-den 64
          echo "exit=$?" >> "$GITHUB_STEP_SUMMARY"
      - name: Hash artifacts (no trailing newline discipline)
        working-directory: CERTIFICATES/prolate/item2_circle
        run: sha256sum prolate_circle_seed.json prolate_circle_tube_pilot.json | tee PILOT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: item2-tube-pilot-${{ env.MODE }}
          path: |
            CERTIFICATES/prolate/item2_circle/prolate_circle_seed.json
            CERTIFICATES/prolate/item2_circle/prolate_circle_tube_pilot.json
            CERTIFICATES/prolate/item2_circle/PILOT_SHA256.txt
