name: Item 3 v9 plan-config builder audit

on:
  push:
    branches:
      - agent/item3-v9-analytic-proof
    paths:
      - "CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/build_rehearsal_plan_config_v9.py"
      - "CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/test_rehearsal_plan_config_builder.py"
      - ".github/workflows/item3-v9-plan-config-builder-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/item3-v9-analytic-proof
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and run controls
        working-directory: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate
        shell: bash
        run: |
          set +e
          python -m py_compile build_dependency_snapshot_v9.py build_rehearsal_plan_config_v9.py rehearsal_driver_v9_candidate_v3.py aggregate_verifier_v9_candidate_v2.py test_rehearsal_plan_config_builder.py
          code=$?
          if [ "$code" -eq 0 ]; then
            python -m unittest -v test_rehearsal_plan_config_builder.py > plan_config_builder_audit.log 2>&1
            code=$?
          fi
          cat plan_config_builder_audit.log 2>/dev/null || true
          python - "$code" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          code=int(sys.argv[1])
          report={
            "schema":"ITEM3_SWEEP_V9_PLAN_CONFIG_BUILDER_AUDIT_V1",
            "status":"PASSED" if code == 0 else "FAILED",
            "exit_code":code,
            "builder_source_sha256":hashlib.sha256(Path("build_rehearsal_plan_config_v9.py").read_bytes()).hexdigest(),
            "test_source_sha256":hashlib.sha256(Path("test_rehearsal_plan_config_builder.py").read_bytes()).hexdigest(),
          }
          Path("plan_config_builder_audit.json").write_text(json.dumps(report,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          PY
          exit "$code"
      - name: Commit audit record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate
          if [ -f plan_config_builder_audit.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- plan_config_builder_audit.json
            if ! git diff --cached --quiet; then
              git diff --cached --check
              git commit -m "Record item3 v9 plan-config builder audit"
              git push origin HEAD:agent/item3-v9-analytic-proof
            fi
          fi
