name: Item 3 v9 connected-pilot 256-leaf validation v1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: item3-v9-connected-pilot-validation-v1
  cancel-in-progress: false

env:
  BASE: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate
  IDBASE: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/connected_pilot_identity_v1
  OUTBASE: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_connected_pilot_v1
  BINDER: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_connected_pilot_v1/bind_connected_identity_validation_v1.py
  PLAN_SHA: aba9b2d1571cdc7c9aa7c4520233cafe7d7690f45bbcd7bbf7068339c78d67a9
  DEPS_SHA: ee033ab46b844168887a6e2e1f5a2b97cc460d1b43bbafd77be49897127950aa
  BINDER_SHA: f9f5ee062e02838abc4b7455f46e04c82d1fbdda36712457e35b29598be6cf76
  REQUIRED_ANCESTOR: d300a4d98c03d513f6216a8899838c229c6e36f3

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"

      - name: Install pinned validated arithmetic
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0

      - name: Fail-closed exact-identity preflight
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$REQUIRED_ANCESTOR" HEAD
          python - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          import flint

          base=Path(os.environ["BASE"]); ident=Path(os.environ["IDBASE"])
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          expected={
            ident/"plan_config/connected_pilot_plan_v2.json": os.environ["PLAN_SHA"],
            ident/"dependencies/dependency_snapshot_v9_candidate.json": os.environ["DEPS_SHA"],
            ident/"plan_config/shard_0_config_v1.json":"f3838d1c49f917e19fabfdb8c991dd5040128f81aadd58a930218dceecef2b03",
            ident/"plan_config/shard_1_config_v1.json":"2c1a612c1d32c5675af92dd0fad2c07b4af18b0bab370e62d44a68a8d44d0f41",
            ident/"plan_config/shard_2_config_v1.json":"32214842510f63cdf781dac4f145d5d4a46942b1194d9386717cdba1a4c95002",
            ident/"plan_config/shard_3_config_v1.json":"36bd40c39c722805f3742b3a9e8f562e2c39deca07c4f27666f54a88bf6e7ebe",
            Path(os.environ["BINDER"]):os.environ["BINDER_SHA"],
            base/"validation_corpus_v2/run_validation_corpus_v2.py":"80eeb7752a6dc221b94f6a7ce3d51a92d6e84b3d5728160f102f7ae64b8f2842",
            base/"validation_corpus_v2/independent_reference_v2.py":"95fd576020bb6ac11a04fec479056b326af6eaa9ae04914d9099294e2adfcd8b",
            base/"validation_corpus_v2/CONTROL_EXPECT.json":"60866c3ccf964433cecf0a636ba99590001f1136c1efd526e9d47bfc5715256e",
          }
          source={
            "adapter":"8a52b7bfa9491976df2ece4f3858a8bc4b4350222c60840c82fff92e0a05913b",
            "aggregate_verifier":"c8990f24f28fba74178b99129d1fd1c4d0bd05a46a65e7e0a11e1fea9b251eef",
            "bridge":"59edc8bb73a9e263e8b0b102086ff92dff3898580f92bfe10d6c7216bdfbdebc",
            "checker":"b52fe84cf8084ecd55aa43322fb7577861dfde4d76689b587e1863b532c1aa50",
            "checkpoint":"253ace8c28c9c5f2d4cb8a9c42b951f759c8f2be619da6845992dca0da10574c",
            "driver":"d0a74897aafa04303fbbf2d6ff00467cc47af75e0e978dc37f3ded89ef6339ef",
            "kernel":"abac1ce574097df32491aba187694b9800a3f76de9a85df9be0b7995923dab76",
            "runner":"f8f7df69e2693d35879cc7021ca61d21acdfc27aa52cd45635d4d871a6af34e7",
          }
          paths={
            "adapter":base/"adapter_v9_candidate_v2.py",
            "aggregate_verifier":base/"aggregate_verifier_v9_candidate_v2.py",
            "bridge":base/"checkpoint_bridge_v9_candidate_v2.py",
            "checker":base/"checker_v9_candidate_v2.py",
            "checkpoint":base/"checkpoint_v9_candidate.py",
            "driver":base/"rehearsal_driver_v9_candidate_v3.py",
            "kernel":base/"prolate_F_derivatives_cleanroom_v9_candidate.py",
            "runner":base/"runner_v9_candidate_v2.py",
          }
          for p,h in expected.items():
            if sha(p)!=h: raise SystemExit(f"pinned input drift: {p}: {sha(p)} != {h}")
          for k,p in paths.items():
            if sha(p)!=source[k]: raise SystemExit(f"proof-source drift: {k}")
          plan=json.loads((ident/"plan_config/connected_pilot_plan_v2.json").read_text())
          if plan["source_sha256"]!=source: raise SystemExit("plan source map drift")
          for i in range(4):
            cfg=json.loads((ident/f"plan_config/shard_{i}_config_v1.json").read_text())
            if cfg["source_sha256"]!=source or cfg["aggregate_plan_sha256"]!=os.environ["PLAN_SHA"]:
              raise SystemExit(f"config {i} identity drift")
          if platform.python_version()!="3.13.14": raise SystemExit("Python mismatch")
          if getattr(flint,"__version__",None)!="0.9.0": raise SystemExit("python-flint mismatch")
          if getattr(flint,"__FLINT_VERSION__",None)!="3.6.0": raise SystemExit("FLINT mismatch")
          print("CONNECTED_VALIDATION_PREFLIGHT=PASS")
          PY

      - name: Execute counted 256-leaf corpus in isolated worktree
        id: corpus
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$RUNNER_TEMP/item3-validation-tree"
          git worktree add --detach "$RUNNER_TEMP/item3-validation-tree" "$GITHUB_SHA"
          mkdir -p validation-work
          set +e
          (
            cd "$RUNNER_TEMP/item3-validation-tree"
            python CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_corpus_v2/run_validation_corpus_v2.py
          ) > validation-work/CORPUS_STDOUT.log 2> validation-work/CORPUS_STDERR.log
          rc=$?
          set -e
          printf '%s\n' "$rc" > validation-work/CORPUS_EXIT_CODE.txt
          cp "$RUNNER_TEMP/item3-validation-tree/$BASE/validation_corpus_v2/CONTROL_MATRIX.json" validation-work/CONTROL_MATRIX.json 2>/dev/null || true
          cp "$RUNNER_TEMP/item3-validation-tree/$BASE/validation_corpus_v2/VALIDATION_REPORT.json" validation-work/VALIDATION_REPORT.json 2>/dev/null || true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Bind counted corpus to exact four-shard identity
        if: steps.corpus.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$OUTBASE/run_v1"
          python "$BINDER" validation-work/VALIDATION_REPORT.json "$OUTBASE/run_v1/CONNECTED_VALIDATION_REPORT.json"
          cp validation-work/CONTROL_MATRIX.json "$OUTBASE/run_v1/UNDERLYING_CONTROL_MATRIX.json"
          cp validation-work/VALIDATION_REPORT.json "$OUTBASE/run_v1/UNDERLYING_VALIDATION_REPORT.json"

      - name: Record exact validation environment
        if: steps.corpus.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          import flint
          out=Path(os.environ["OUTBASE"])/"run_v1"
          wf=Path(".github/workflows/item3-v9-connected-pilot-validation-v1.yml")
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          obj={
            "schema":"ITEM3_SWEEP_V9_CONNECTED_VALIDATION_ENVIRONMENT_V1",
            "authorization":"VALIDATION_ONLY",
            "github_sha":os.environ.get("GITHUB_SHA"),
            "github_run_id":os.environ.get("GITHUB_RUN_ID"),
            "github_run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
            "python":platform.python_version(),
            "python_flint":getattr(flint,"__version__","UNKNOWN"),
            "flint_library":getattr(flint,"__FLINT_VERSION__","UNKNOWN"),
            "workflow_sha256":sha(wf),
            "binder_sha256":sha(os.environ["BINDER"]),
            "plan_sha256":os.environ["PLAN_SHA"],
            "freeze_authorized":False,
            "production_rehearsal_authorized":False,
            "tag_created":False,
            "certified_lambda_range":False,
          }
          (out/"VALIDATION_ENVIRONMENT.json").write_text(json.dumps(obj,sort_keys=True,separators=(",",":"))+"\n")
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: item3-v9-connected-validation-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation-work/
            CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_connected_pilot_v1/run_v1/

      - name: Commit successful counted validation additively
        if: steps.corpus.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["OUTBASE"])/"run_v1/CONNECTED_VALIDATION_REPORT.json"
          obj=json.loads(p.read_text())
          if obj.get("status")!="PASSED" or obj.get("leaf_count")!=256 or obj.get("failure_count")!=0:
            raise SystemExit("connected validation report not PASS")
          if obj.get("freeze_authorized") or obj.get("production_rehearsal_authorized") or obj.get("tag_created") or obj.get("certified_lambda_range"):
            raise SystemExit("forbidden promotion flag")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUTBASE/run_v1"
          git diff --cached --check
          git commit -m "Record item3 v9 connected-pilot counted validation"
          git push origin HEAD:agent/item3-v9-analytic-proof

      - name: Enforce counted verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.corpus.outputs.rc }}" = "0"
          test -f "$OUTBASE/run_v1/CONNECTED_VALIDATION_REPORT.json"
