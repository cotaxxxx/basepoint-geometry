name: Apply item3 C-G-TUBE hybrid audit r2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_item3_cgtube_hybrid_audit_r2.yml
      - .github/scripts/apply_item3_cgtube_hybrid_audit_r2.py
  workflow_dispatch: {}

permissions:
  contents: write

env:
  BASE_SHA: 3a025346da89818273dc22616e6c7995478f25bb
  TARGET_BRANCH: agent/prolate-item3-cgtube-hybrid-audit-r2
  DIR: CERTIFICATES/prolate/item3_center_connection/c_g_tube

jobs:
  apply-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          path: control
          persist-credentials: false
      - name: Checkout isolated revision branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: work
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Apply and validate audit revision
        shell: bash
        env:
          CG_TUBE_REPO_ROOT: ${{ github.workspace }}/work
        run: |
          set -euo pipefail
          test "$(git -C work rev-parse HEAD)" = "$BASE_SHA"
          python control/.github/scripts/apply_item3_cgtube_hybrid_audit_r2.py work
          python -m py_compile \
            "work/$DIR/c_g_tube_pilot.py" \
            "work/$DIR/c_g_tube_checker.py" \
            "work/$DIR/run_controls.py"
          pip install python-flint==0.9.0
          python "work/$DIR/run_controls.py"
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["verdict"])' "work/$DIR/CONTROLS.json")" = PASS
          rm -f "work/$DIR/CONTROLS.json"
          rm -rf "work/$DIR/__pycache__"
          git -C work diff --check
          actual="$(git -C work diff --name-only | sort)"
          expected="$(printf '%s\n' \
            "$DIR/README.md" \
            "$DIR/c_g_tube_checker.py" \
            "$DIR/c_g_tube_pilot.py" \
            "$DIR/run_controls.py" | sort)"
          test "$actual" = "$expected"
      - name: Commit isolated audit revision
        shell: bash
        run: |
          set -euo pipefail
          git -C work config user.name github-actions[bot]
          git -C work config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C work add "$DIR/README.md" "$DIR/c_g_tube_checker.py" \
            "$DIR/c_g_tube_pilot.py" "$DIR/run_controls.py"
          actual="$(git -C work diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            "$DIR/README.md" \
            "$DIR/c_g_tube_checker.py" \
            "$DIR/c_g_tube_pilot.py" \
            "$DIR/run_controls.py" | sort)"
          test "$actual" = "$expected"
          git -C work commit -m "Close refined center-spot trust boundary"
          git -C work push origin HEAD:"$TARGET_BRANCH"
          echo "revision_head=$(git -C work rev-parse HEAD)"
