name: Apply item3 C-G-TUBE hybrid audit r2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_item3_cgtube_hybrid_audit_r2.yml
  workflow_dispatch: {}

permissions:
  contents: write

env:
  BASE_SHA: 3a025346da89818273dc22616e6c7995478f25bb
  TARGET_BRANCH: agent/prolate-item3-cgtube-hybrid-audit-r2
  DIR: CERTIFICATES/prolate/item3_center_connection/c_g_tube
  CG_TUBE_REPO_ROOT: ${{ github.workspace }}

jobs:
  apply-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Apply bounded audit revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
