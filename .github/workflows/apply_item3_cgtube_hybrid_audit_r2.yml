    if negative != bool(rec.get("negative")):
        die("CENTER IDENTITY NEGATIVITY MISMATCH", 1)
    return negative, total_lo, total_hi


def identity_record_negative(rec: dict) -> bool:
    return identity_record_bounds(rec)[0]
