name: Item 3 v9 two-blocker repair

on:
  push:
    branches:
      - agent/item3-v9-analytic-proof
    paths:
      - ".github/workflows/item3-v9-two-blocker-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/item3-v9-analytic-proof
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned interval runtime
        run: python -m pip install python-flint==0.9.0

      - name: Apply repair set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          base = Path("CERTIFICATES/prolate/item3_center_connection/lambda_sweep")
          cand = base / "v9_candidate"

          # 1. Dependency builder: bind the formula map at its actual candidate path.
          dep = cand / "build_dependency_snapshot_v9.py"
          text = dep.read_text(encoding="utf-8")
          old = 'FORMULA_MAP_PATH = BASE + "v9_draft/SOURCE_FORMULA_MAP_CANDIDATE_V2.md"'
          new = 'FORMULA_MAP_PATH = BASE + "v9_candidate/SOURCE_FORMULA_MAP_CANDIDATE_V2.md"'
          if text.count(old) != 1:
              raise SystemExit(f"dependency path marker count = {text.count(old)}")
          dep.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 2. Aggregate verifier: require the exact v3 driver identity.
          agg = cand / "aggregate_verifier_v9_candidate_v2.py"
          lines = agg.read_text(encoding="utf-8").splitlines(keepends=True)
          needle = 'raise AggregateReject("shard evidence is not frozen production PASS candidate")'
          matches = [i for i, line in enumerate(lines) if needle in line]
          if len(matches) != 1:
              raise SystemExit(f"aggregate gate anchor count = {len(matches)}")
          i = matches[0]
          raise_indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          if_indent = raise_indent[:-4]
          gate = if_indent + 'if obj["driver_id"] != "ITEM3_SWEEP_V9_REHEARSAL_DRIVER_CANDIDATE_V3":\n'
          reject = raise_indent + 'raise AggregateReject("shard evidence driver ID mismatch")\n'
          lines[i + 1:i + 1] = [gate, reject]
          agg.write_text(''.join(lines), encoding="utf-8")
          aggregate_sha = hashlib.sha256(agg.read_bytes()).hexdigest()

          # 3. Driver/config parser: the common source map also binds aggregate verifier bytes.
          driver = cand / "rehearsal_driver_v9_candidate_v3.py"
          text = driver.read_text(encoding="utf-8")
          bridge_anchor = 'BRIDGE_SHA256 = "59edc8bb73a9e263e8b0b102086ff92dff3898580f92bfe10d6c7216bdfbdebc"\n'
          if text.count(bridge_anchor) != 1:
              raise SystemExit(f"driver bridge anchor count = {text.count(bridge_anchor)}")
          insert = (
              bridge_anchor
              + 'AGGREGATE_VERIFIER_PATH = BASE + "aggregate_verifier_v9_candidate_v2.py"\n'
              + f'AGGREGATE_VERIFIER_SHA256 = "{aggregate_sha}"\n'
          )
          text = text.replace(bridge_anchor, insert, 1)
          old_keys = 'source_keys = {"kernel", "adapter", "runner", "checker", "checkpoint", "bridge", "driver"}'
          new_keys = 'source_keys = {"kernel", "adapter", "runner", "checker", "checkpoint", "bridge", "driver", "aggregate_verifier"}'
          if text.count(old_keys) != 1:
              raise SystemExit(f"driver source-key marker count = {text.count(old_keys)}")
          text = text.replace(old_keys, new_keys, 1)
          compiled_anchor = '        "bridge": BRIDGE_SHA256,\n'
          if text.count(compiled_anchor) != 1:
              raise SystemExit(f"driver compiled-map anchor count = {text.count(compiled_anchor)}")
          text = text.replace(
              compiled_anchor,
              compiled_anchor + '        "aggregate_verifier": AGGREGATE_VERIFIER_SHA256,\n',
              1,
          )
          driver.write_text(text, encoding="utf-8")

          # 4. Driver binding test fixture must exercise the same eight-key source map.
          test_driver = cand / "test_rehearsal_driver_v3_binding.py"
          text = test_driver.read_text(encoding="utf-8")
          test_anchor = '        "bridge": d.BRIDGE_SHA256,\n'
          if text.count(test_anchor) != 1:
              raise SystemExit(f"driver-test source-map anchor count = {text.count(test_anchor)}")
          text = text.replace(
              test_anchor,
              test_anchor + '        "aggregate_verifier": d.AGGREGATE_VERIFIER_SHA256,\n',
              1,
          )
          test_driver.write_text(text, encoding="utf-8")
          PY

      - name: Run focused regression controls
        working-directory: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            build_dependency_snapshot_v9.py \
            build_rehearsal_plan_config_v9.py \
            aggregate_verifier_v9_candidate_v2.py \
            rehearsal_driver_v9_candidate_v3.py \
            test_dependency_snapshot_builder.py \
            test_rehearsal_plan_config_builder.py \
            test_aggregate_verifier_v9_candidate_v2.py \
            test_rehearsal_driver_v3_binding.py
          python -m unittest -v \
            test_dependency_snapshot_builder.py \
            test_rehearsal_plan_config_builder.py \
            test_aggregate_verifier_v9_candidate_v2.py \
            test_rehearsal_driver_v3_binding.py

      - name: Write repair receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          base = Path("CERTIFICATES/prolate/item3_center_connection/lambda_sweep")
          cand = base / "v9_candidate"
          files = [
              cand / "build_dependency_snapshot_v9.py",
              cand / "aggregate_verifier_v9_candidate_v2.py",
              cand / "rehearsal_driver_v9_candidate_v3.py",
              cand / "test_rehearsal_driver_v3_binding.py",
          ]
          receipt = base / "v9_draft/TWO_BLOCKER_REPAIR_RECEIPT_2026-08-08.md"
          hashes = "".join(
              f"- {p.name} sha256: `{hashlib.sha256(p.read_bytes()).hexdigest()}`\n" for p in files
          )
          receipt.write_text(
              "# Item 3 sweep v9 — repair receipt\n\n"
              "Status: **FOCUSED REGRESSION PASS / FREEZE STILL NOT AUTHORIZED**\n\n"
              "Date: 2026-08-08\n\n"
              "## Repairs\n\n"
              "1. Dependency builder binds the existing `v9_candidate/SOURCE_FORMULA_MAP_CANDIDATE_V2.md`.\n"
              "2. Aggregate verifier rejects any shard evidence whose `driver_id` is not exactly "
              "`ITEM3_SWEEP_V9_REHEARSAL_DRIVER_CANDIDATE_V3`.\n"
              "3. Driver/config parsing now uses the same eight-key common source map as the plan/aggregate layer, "
              "including the pinned aggregate-verifier bytes.\n\n"
              "## Focused controls\n\n"
              "The workflow compiled and ran dependency-builder, plan/config-builder, aggregate-verifier, "
              "and driver-v3 binding control suites. This receipt is written only after all focused controls pass.\n\n"
              "## Source identities after repair\n\n"
              + hashes
              + "\nThis repair does not issue a production tag, freeze receipt, production rehearsal, "
              "`CERTIFIED_LAMBDA_RANGE`, or paper-level completion claim.\n",
              encoding="utf-8",
          )
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/build_dependency_snapshot_v9.py \
            CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/aggregate_verifier_v9_candidate_v2.py \
            CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/rehearsal_driver_v9_candidate_v3.py \
            CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/test_rehearsal_driver_v3_binding.py \
            CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_draft/TWO_BLOCKER_REPAIR_RECEIPT_2026-08-08.md
          git diff --cached --check
          git commit -m "Repair item3 v9 source-map and driver gates"
          git push origin HEAD:agent/item3-v9-analytic-proof
