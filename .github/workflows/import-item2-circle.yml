name: Import exact item 2 circle commit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/import-item2-circle.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore exact bundle commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            .github/workflows/prolate-item2-circle-pilot.yml
            CERTIFICATES/prolate/item2_circle/README.md
            CERTIFICATES/prolate/item2_circle/prolate_circle_seed.py
            CERTIFICATES/prolate/item2_circle/prolate_circle_tube_pilot.py
            CERTIFICATES/prolate/item2_circle/selftest/mock_kernels.py
            CERTIFICATES/prolate/item2_circle/vendor/README.md
          )
          shas=(
            76f1ba70c503451e9a53a9158dafc9638148b26d
            987c8485b53520ceedcda3412a7d1894f4c8cfa2
            b0f5205ab1cf8c06990401298554461ac381625f
            1ab9485e198c5775ec304610da9b83dfb730c149
            4e1d87f2144e8db5454240b482e10e7e2b4131f7
            f9f2bcabbe96aa20c7f0e7e279d9648cecd9cff5
          )
          for i in "${!paths[@]}"; do
            tmp="$(mktemp)"
            gh api "/repos/$REPO/git/blobs/${shas[$i]}" --jq .content | base64 -d > "$tmp"
            test "$(git hash-object -w "$tmp")" = "${shas[$i]}"
            rm "$tmp"
          done

          target_tree=1f93bb3234a4b6ed268e481206899518188ac4f8
          found=''
          for mask in $(seq 0 63); do
            git read-tree 3888936d44bcd2c8abd84c5ee4dc1f337d93dbdd^{tree}
            for i in "${!paths[@]}"; do
              mode=100644
              if (( (mask >> i) & 1 )); then mode=100755; fi
              git update-index --add --cacheinfo "$mode,${shas[$i]},${paths[$i]}"
            done
            tree="$(git write-tree)"
            if [ "$tree" = "$target_tree" ]; then
              found="$mask"
              echo "Recovered exact tree modes with mask=$mask"
              break
            fi
          done
          test -n "$found"
          test "$(git write-tree)" = "$target_tree"

          echo '' | base64 -d > /tmp/item2-message
          export GIT_AUTHOR_NAME='Claude (assistant)'
          export GIT_AUTHOR_EMAIL='noreply@anthropic.com'
          export GIT_COMMITTER_NAME='Claude (assistant)'
          export GIT_COMMITTER_EMAIL='noreply@anthropic.com'
          export GIT_AUTHOR_DATE='@1785057380 +0000'
          export GIT_COMMITTER_DATE='@1785057380 +0000'
          commit="$(git commit-tree "$target_tree" -p 3888936d44bcd2c8abd84c5ee4dc1f337d93dbdd < /tmp/item2-message)"
          echo "Reconstructed commit=$commit"
          test "$commit" = 92c46e5de1a56d90ccf707154f535bbc2a8db76d
          git push origin "$commit:refs/heads/agent/prolate-item2-circle"
      - name: Remove import branch
        if: success()
        run: git push origin --delete agent/import-item2-circle
