name: Export item 2 bundle prerequisite trees

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/import-item2-circle.yml

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Export raw prerequisite tree objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/item2-base-trees
          for sha in \
            32e2d494001a2f1509ec7e389db92a06e42c4bd0 \
            003544faf26a39480556854846503bffa798a887 \
            311117b8cf9e36788b6216a7389727e18623afb4
          do
            git cat-file tree "$sha" | base64 -w0 > "/tmp/item2-base-trees/$sha.b64"
            git ls-tree "$sha" > "/tmp/item2-base-trees/$sha.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: item2-bundle-prerequisite-trees
          path: /tmp/item2-base-trees
