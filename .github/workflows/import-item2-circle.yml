name: Import exact item 2 circle commit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/import-item2-circle.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore exact blobs and commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          put_blob() {
            local sha="$1" path="$2"
            mkdir -p "$(dirname "$path")"
            gh api "/repos/$REPO/git/blobs/$sha" --jq .content | base64 -d > "$path"
            test "$(git hash-object "$path")" = "$sha"
          }
          put_blob 76f1ba70c503451e9a53a9158dafc9638148b26d .github/workflows/prolate-item2-circle-pilot.yml
          put_blob 987c8485b53520ceedcda3412a7d1894f4c8cfa2 CERTIFICATES/prolate/item2_circle/README.md
          put_blob b0f5205ab1cf8c06990401298554461ac381625f CERTIFICATES/prolate/item2_circle/prolate_circle_seed.py
          put_blob 1ab9485e198c5775ec304610da9b83dfb730c149 CERTIFICATES/prolate/item2_circle/prolate_circle_tube_pilot.py
          put_blob 4e1d87f2144e8db5454240b482e10e7e2b4131f7 CERTIFICATES/prolate/item2_circle/selftest/mock_kernels.py
          put_blob f9f2bcabbe96aa20c7f0e7e279d9648cecd9cff5 CERTIFICATES/prolate/item2_circle/vendor/README.md
          git add .github/workflows/prolate-item2-circle-pilot.yml CERTIFICATES/prolate/item2_circle
          tree="$(git write-tree)"
          test "$tree" = 1f93bb3234a4b6ed268e481206899518188ac4f8
          cat > /tmp/item2-message <<'EOF'
          Scaffold prolate item 2 circle-branch certification

          - DAG: B-KERNEL / B-LOCAL / B-SEED / B-TUBE / B-EXT / B-JOIN / B-DAG
          - 1-D interval-Krawczyk tube pilot (strict-inclusion criterion),
            harness validated end-to-end: positive control 16/16 certified,
            negative control 0/16 (no false certification)
          - workflow_dispatch-only pilot with SELFTEST guard until the item-0
            F(r,lambda) kernels are vendored (B-KERNEL debt; module sha256
            ef065381... recorded in item0d certificate provenance)
          - artifact JSONs written without trailing newline (hash discipline)
          EOF
          export GIT_AUTHOR_NAME='Claude (assistant)'
          export GIT_AUTHOR_EMAIL='noreply@anthropic.com'
          export GIT_COMMITTER_NAME='Claude (assistant)'
          export GIT_COMMITTER_EMAIL='noreply@anthropic.com'
          export GIT_AUTHOR_DATE='@1785057380 +0000'
          export GIT_COMMITTER_DATE='@1785057380 +0000'
          commit="$(git commit-tree "$tree" -p 3888936d44bcd2c8abd84c5ee4dc1f337d93dbdd < /tmp/item2-message)"
          test "$commit" = 92c46e5de1a56d90ccf707154f535bbc2a8db76d
          git push origin "$commit:refs/heads/agent/prolate-item2-circle"
      - name: Remove import branch
        if: success()
        run: git push origin --delete agent/import-item2-circle
