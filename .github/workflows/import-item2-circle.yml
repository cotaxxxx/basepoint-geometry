name: Diagnose exact item 2 bundle import

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/import-item2-circle.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct and record exact identifiers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          : > /tmp/item2-import-diagnostic.txt
          cd CERTIFICATES/prolate/item0d_interior
          python reconstruct_zip.py >> /tmp/item2-import-diagnostic.txt 2>&1
          echo "zip_sha256=$(sha256sum item0d_certified.zip | cut -d' ' -f1)" >> /tmp/item2-import-diagnostic.txt
          echo "zip_blob=$(git hash-object -w item0d_certified.zip)" >> /tmp/item2-import-diagnostic.txt
          cd ../../..

          put_blob() {
            local sha="$1" path="$2" tmp
            tmp="$(mktemp)"
            mkdir -p "$(dirname "$path")"
            gh api "/repos/$REPO/git/blobs/$sha" --jq .content | base64 -d > "$tmp"
            echo "$path $(git hash-object -w "$tmp") expected=$sha" >> /tmp/item2-import-diagnostic.txt
            mv "$tmp" "$path"
          }
          put_blob 76f1ba70c503451e9a53a9158dafc9638148b26d .github/workflows/prolate-item2-circle-pilot.yml
          put_blob 987c8485b53520ceedcda3412a7d1894f4c8cfa2 CERTIFICATES/prolate/item2_circle/README.md
          put_blob b0f5205ab1cf8c06990401298554461ac381625f CERTIFICATES/prolate/item2_circle/prolate_circle_seed.py
          put_blob 1ab9485e198c5775ec304610da9b83dfb730c149 CERTIFICATES/prolate/item2_circle/prolate_circle_tube_pilot.py
          put_blob 4e1d87f2144e8db5454240b482e10e7e2b4131f7 CERTIFICATES/prolate/item2_circle/selftest/mock_kernels.py
          put_blob f9f2bcabbe96aa20c7f0e7e279d9648cecd9cff5 CERTIFICATES/prolate/item2_circle/vendor/README.md

          git add CERTIFICATES/prolate/item0d_interior/item0d_certified.zip \
            .github/workflows/prolate-item2-circle-pilot.yml CERTIFICATES/prolate/item2_circle
          tree="$(git write-tree)"
          echo "tree=$tree expected=1f93bb3234a4b6ed268e481206899518188ac4f8" >> /tmp/item2-import-diagnostic.txt
          git diff --cached --raw >> /tmp/item2-import-diagnostic.txt

          echo '' | base64 -d > /tmp/item2-message
          export GIT_AUTHOR_NAME='Claude (assistant)'
          export GIT_AUTHOR_EMAIL='noreply@anthropic.com'
          export GIT_COMMITTER_NAME='Claude (assistant)'
          export GIT_COMMITTER_EMAIL='noreply@anthropic.com'
          export GIT_AUTHOR_DATE='@1785057380 +0000'
          export GIT_COMMITTER_DATE='@1785057380 +0000'
          commit="$(git commit-tree "$tree" -p 3888936d44bcd2c8abd84c5ee4dc1f337d93dbdd < /tmp/item2-message 2>> /tmp/item2-import-diagnostic.txt)"
          echo "commit=$commit expected=92c46e5de1a56d90ccf707154f535bbc2a8db76d" >> /tmp/item2-import-diagnostic.txt
          cat /tmp/item2-import-diagnostic.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item2-exact-import-diagnostic
          path: /tmp/item2-import-diagnostic.txt
