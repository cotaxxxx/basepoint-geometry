name: Prolate item2 B-KERNEL clean-room audit

on:
  pull_request:
    paths:
      - "CERTIFICATES/prolate/item0d_interior/item0d_certified.zip"
      - "CERTIFICATES/prolate/item2_circle/**"
      - ".github/workflows/prolate-item2-bkernel-cleanroom.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prolate-item2-bkernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install python-flint==0.9.0 sympy numpy
      - name: Verify immutable inputs and record repository bytes
        working-directory: CERTIFICATES/prolate/item2_circle/cleanroom
        run: |
          echo "db1c68e4bbf43fcb49bd5f27de5d45a36b44f1f8e77141477832ce16ae68df2a  ../../item0d_interior/item0d_certified.zip" | sha256sum -c -
          echo "77e7a93c594ba66ac7d98df29ec3c03107b0c63962a5aa60f8503559082c10ac  ../vendor/prolate_circle_F_cleanroom.py" | sha256sum -c -
          sha256sum bkernel_cleanroom_audit.py ../vendor/prolate_circle_F_cleanroom.py > OBSERVED_INPUT_SHA256.txt
          python -m py_compile bkernel_cleanroom_audit.py ../vendor/prolate_circle_F_cleanroom.py ../vendor/prolate_circle_kernels.py
      - name: Rebuild exact fixture and run non-rigorous independent audits
        working-directory: CERTIFICATES/prolate/item2_circle/cleanroom
        env:
          PYTHONPATH: ../vendor
        run: |
          python bkernel_cleanroom_audit.py fixture
          echo "800b12fd6850f1b3dde0d22d3afa13918dbb46687f98ae99f5c8097083ed47eb  item0d_regression_fixture.json" | sha256sum -c -
          python bkernel_cleanroom_audit.py nonrigorous
      - name: Check regression harness controls
        working-directory: CERTIFICATES/prolate/item2_circle/cleanroom
        env:
          PYTHONPATH: ../vendor
        run: python bkernel_cleanroom_audit.py controls
      - name: Rigorous one-leaf smoke
        working-directory: CERTIFICATES/prolate/item2_circle/cleanroom
        env:
          PYTHONPATH: ../vendor
        run: python bkernel_cleanroom_audit.py regression --limit-leaves 1 --dps 40 --tol 1e-10 --depth-limit 12 --eval-limit 200000
      - name: Rigorous all-224-leaf item0d regression
        working-directory: CERTIFICATES/prolate/item2_circle/cleanroom
        env:
          PYTHONPATH: ../vendor
        run: python bkernel_cleanroom_audit.py regression --dps 40 --tol 1e-10 --depth-limit 12 --eval-limit 200000
      - name: Rigorous symbolic and difference-quotient audit
        working-directory: CERTIFICATES/prolate/item2_circle/cleanroom
        env:
          PYTHONPATH: ../vendor
        run: python bkernel_cleanroom_audit.py dq --points 24 --dps 40 --h 1/4096 --tol 1e-10 --depth-limit 12 --eval-limit 200000
      - name: Verify public B-KERNEL interface
        working-directory: CERTIFICATES/prolate/item2_circle
        env:
          PYTHONPATH: vendor
        run: |
          python - <<'PY'
          import prolate_circle_kernels as K
          assert K.FORMULA_STATE == "FILLED"
          for name in ("F_arb", "dFdr_arb", "F_float", "dFdr_float"):
              assert callable(getattr(K, name))
          print("B-KERNEL interface PASS")
          PY
      - name: Hash audit reports
        if: always()
        working-directory: CERTIFICATES/prolate/item2_circle/cleanroom
        run: |
          files=()
          for f in item0d_regression_fixture.json symbolic_formula_audit_pure.json reference_midpoint_audit.json regression_harness_controls.json regression_item0d_report.json symbolic_audit_dFdr_report.json; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done
          if [ "${#files[@]}" -gt 0 ]; then sha256sum "${files[@]}" > B_KERNEL_REPORT_SHA256.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prolate-item2-bkernel-cleanroom-audit
          path: |
            CERTIFICATES/prolate/item2_circle/cleanroom/OBSERVED_INPUT_SHA256.txt
            CERTIFICATES/prolate/item2_circle/cleanroom/item0d_regression_fixture.json
            CERTIFICATES/prolate/item2_circle/cleanroom/symbolic_formula_audit_pure.json
            CERTIFICATES/prolate/item2_circle/cleanroom/reference_midpoint_audit.json
            CERTIFICATES/prolate/item2_circle/cleanroom/regression_harness_controls.json
            CERTIFICATES/prolate/item2_circle/cleanroom/regression_item0d_report.json
            CERTIFICATES/prolate/item2_circle/cleanroom/symbolic_audit_dFdr_report.json
            CERTIFICATES/prolate/item2_circle/cleanroom/B_KERNEL_REPORT_SHA256.txt
          if-no-files-found: warn
