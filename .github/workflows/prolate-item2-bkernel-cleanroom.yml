name: Prolate item2 B-KERNEL clean-room audit

on:
  pull_request:
    paths:
      - "CERTIFICATES/prolate/item0d_interior/item0d_certified.zip"
      - "CERTIFICATES/prolate/item2_circle/**"
      - ".github/workflows/prolate-item2-bkernel-cleanroom.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prolate-item2-bkernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect-item0d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract certified item0d metadata
        run: |
          rm -rf item0d-diagnostic
          mkdir item0d-diagnostic
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          source = Path("CERTIFICATES/prolate/item0d_interior/item0d_certified.zip")
          out = Path("item0d-diagnostic")
          raw = source.read_bytes()
          archive = {
              "zip_sha256": hashlib.sha256(raw).hexdigest(),
              "members": [],
          }
          with zipfile.ZipFile(source) as z:
              for name in z.namelist():
                  data = z.read(name)
                  archive["members"].append({
                      "name": name,
                      "size": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })
                  if name.endswith(".json"):
                      target = out / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
          (out / "archive_manifest.json").write_text(
              json.dumps(archive, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prolate-item0d-diagnostic-json
          path: item0d-diagnostic
          if-no-files-found: error
