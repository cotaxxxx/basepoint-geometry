name: Repair item 6 rational Arb intervals

on:
  pull_request:
    paths:
      - ".github/workflows/prolate-item6-repair-interval-constructor.yml"
  push:
    branches:
      - agent/prolate-item6-axis
    paths:
      - ".github/workflows/prolate-item6-repair-interval-constructor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prolate-item6-axis
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Replace unsupported fmpq midpoint-radius construction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("CERTIFICATES/prolate/item6_axis")
          old = "return arb((lo + hi) / 2, (hi - lo) / 2)"
          new = "return arb(str((lo + hi) / 2), str((hi - lo) / 2))"
          changed = []
          for path in sorted(root.glob("*.py")):
              text = path.read_text(encoding="utf-8")
              if old in text:
                  count = text.count(old)
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  changed.append((str(path), count))

          if not changed:
              raise SystemExit("no legacy closed_interval constructor found")
          print("patched interval constructors:")
          for path, count in changed:
              print(f"  {path}: {count}")

          audit = r'''#!/usr/bin/env python3
          """Runtime audit for exact rational Arb interval construction."""
          from __future__ import annotations

          import json
          from pathlib import Path

          from flint import arb, ctx, fmpq

          ctx.dps = 50

          def closed_interval(lo: fmpq, hi: fmpq) -> arb:
              if not lo <= hi:
                  raise ValueError("require lo <= hi")
              return arb(str((lo + hi) / 2), str((hi - lo) / 2))

          cases = [
              (fmpq(1, 200), fmpq(3, 400)),
              (fmpq(1, 20), fmpq(1, 8)),
              (fmpq(63, 64), fmpq(127, 128)),
              (fmpq(1), fmpq(100)),
              (fmpq(0), fmpq(1, 2)),
          ]
          records = []
          checks = []
          for lo, hi in cases:
              box = closed_interval(lo, hi)
              lo_ball = arb(str(lo))
              hi_ball = arb(str(hi))
              record = {
                  "lo": str(lo),
                  "hi": str(hi),
                  "box": str(box),
                  "overlaps_lo": bool(box.overlaps(lo_ball)),
                  "overlaps_hi": bool(box.overlaps(hi_ball)),
                  "contains_zero": bool(0 in box),
              }
              records.append(record)
              checks.extend([record["overlaps_lo"], record["overlaps_hi"]])
              if lo > 0:
                  checks.append(not record["contains_zero"])

          legacy = "return arb((lo + hi) / 2, (hi - lo) / 2)"
          legacy_files = []
          for path in sorted(Path(__file__).parent.glob("*.py")):
              if legacy in path.read_text(encoding="utf-8"):
                  legacy_files.append(path.name)
          checks.append(not legacy_files)

          result = {
              "status": "PASSED" if all(checks) else "FAILED",
              "constructor": "arb(rational_midpoint_string, rational_radius_string)",
              "cases": records,
              "legacy_files": legacy_files,
              "conclusion": (
                  "Every tested endpoint ball overlaps the constructed rational "
                  "box, every strictly positive test interval excludes zero, and "
                  "no legacy fmpq two-argument constructor remains."
              ),
          }
          output = Path(__file__).with_suffix(".json")
          output.write_text(json.dumps(result, indent=2), encoding="utf-8")
          print(json.dumps(result, indent=2))
          raise SystemExit(0 if result["status"] == "PASSED" else 1)
          '''
          import textwrap
          audit_path = root / "prolate_axis_interval_constructor_audit.py"
          audit_path.write_text(textwrap.dedent(audit), encoding="utf-8")
          PY
      - name: Verify repaired constructor with python-flint 0.9
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install python-flint==0.9.0
          set +e
          python CERTIFICATES/prolate/item6_axis/prolate_axis_interval_constructor_audit.py > interval_audit.log 2>&1
          CODE=$?
          cat interval_audit.log
          exit $CODE
      - name: Upload interval-constructor audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prolate-item6-interval-constructor-audit
          path: |
            interval_audit.log
            CERTIFICATES/prolate/item6_axis/prolate_axis_interval_constructor_audit.py
            CERTIFICATES/prolate/item6_axis/prolate_axis_interval_constructor_audit.json
          if-no-files-found: warn
      - name: Commit repaired sources and audit
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CERTIFICATES/prolate/item6_axis
          git commit -m "Repair exact rational Arb interval construction"
          git push origin HEAD:agent/prolate-item6-axis
      - name: Reject failed constructor audit
        if: steps.verify.outcome != 'success'
        run: exit 1
