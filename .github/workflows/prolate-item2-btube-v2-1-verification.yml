name: Prolate item 2 B-TUBE v2.1 verification lane

on:
  push:
    branches:
      - controls/btube-v2-1-verification
    paths:
      - .github/verification-launch/btube-v2-1.txt

permissions:
  contents: read

concurrency:
  group: btube-v2-1-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      REL: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
      REQUIRED_PYTHON: "3.11.16"
      REQUIRED_PYFLINT: "0.9.0"
      REQUIRED_FLINT: "3.6.0"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout verification control commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1

      - name: Parse and verify launch manifest
        id: launch
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest="control/.github/verification-launch/btube-v2-1.txt"
          workflow="control/.github/workflows/prolate-item2-btube-v2-1-verification.yml"
          test -f "$manifest"
          test -f "$workflow"
          test "$(wc -l < "$manifest")" -eq 4

          target_head="$(sed -n 's/^TARGET_HEAD=//p' "$manifest")"
          step="$(sed -n 's/^STEP=//p' "$manifest")"
          workflow_sha256="$(sed -n 's/^WORKFLOW_SHA256=//p' "$manifest")"
          launch_id="$(sed -n 's/^LAUNCH_ID=//p' "$manifest")"

          test "$(grep -c '^TARGET_HEAD=' "$manifest")" -eq 1
          test "$(grep -c '^STEP=' "$manifest")" -eq 1
          test "$(grep -c '^WORKFLOW_SHA256=' "$manifest")" -eq 1
          test "$(grep -c '^LAUNCH_ID=' "$manifest")" -eq 1
          [[ "$target_head" =~ ^[0-9a-f]{40}$ ]]
          [[ "$workflow_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$launch_id" =~ ^[A-Za-z0-9._-]+$ ]]
          case "$step" in
            step1|step2|step3) ;;
            *) echo "FAIL: unsupported verification step: $step"; exit 2 ;;
          esac

          actual_workflow_sha256="$(sha256sum "$workflow" | awk '{print $1}')"
          test "$actual_workflow_sha256" = "$workflow_sha256"
          test "$(git -C control rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git -C control status --porcelain=v1 --untracked-files=all)"

          {
            echo "target_head=$target_head"
            echo "step=$step"
            echo "workflow_sha256=$workflow_sha256"
            echo "launch_id=$launch_id"
          } >> "$GITHUB_OUTPUT"

          echo "CONTROL_HEAD=${GITHUB_SHA}"
          echo "TARGET_HEAD=$target_head"
          echo "STEP=$step"
          echo "WORKFLOW_SHA256=$workflow_sha256"
          echo "LAUNCH_ID=$launch_id"

      - name: Checkout exact target HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.launch.outputs.target_head }}
          path: target
          persist-credentials: false
          fetch-depth: 1

      - name: Verify fresh target checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "${{ steps.launch.outputs.target_head }}"
          test -z "$(git -C target status --porcelain=v1 --untracked-files=all)"
          test ! -e target/btube-calibration-run
          test ! -e target/btube-calibration-delivery
          echo "HEAD_BEFORE=$(git -C target rev-parse HEAD)"
          echo "TREE_BEFORE=$(git -C target rev-parse 'HEAD^{tree}')"

      - name: Set up exact Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11.16"
          cache: "pip"
          cache-dependency-path: target/CERTIFICATES/prolate/item2_circle/b_tube_v2_1/requirements-calibration.txt

      - name: Install hash-locked verification dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r "target/${REL}/requirements-calibration.txt"

      - name: Enforce environment four-pin gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import sys
          import flint

          expected_python = (3, 11, 16)
          expected_pyflint = "0.9.0"
          expected_flint = "3.6.0"

          actual_python = sys.version_info[:3]
          actual_pyflint = flint.__version__
          actual_flint = flint.__FLINT_VERSION__

          print("PYTHON_VERSION=" + ".".join(map(str, actual_python)))
          print("PYTHON_FLINT_VERSION=" + str(actual_pyflint))
          print("FLINT_VERSION=" + str(actual_flint))

          if actual_python != expected_python:
              raise SystemExit(f"Python pin mismatch: {actual_python!r}")
          if actual_pyflint != expected_pyflint:
              raise SystemExit(f"python-flint pin mismatch: {actual_pyflint!r}")
          if actual_flint != expected_flint:
              raise SystemExit(f"FLINT pin mismatch: {actual_flint!r}")
          PY
          test "$(git -C target rev-parse HEAD)" = "${{ steps.launch.outputs.target_head }}"

      - name: Step 1 — static compile and 103 tests
        if: steps.launch.outputs.step == 'step1'
        working-directory: target/CERTIFICATES/prolate/item2_circle/b_tube_v2_1
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/btube-pycache-step1
        run: |
          set -Eeuo pipefail
          start_ns="$(date +%s%N)"
          echo "BTUBE_GITHUB_VERIFICATION_STEP1_V1"
          echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          find . -name '*.py' -print0 | sort -z | xargs -0 python -m py_compile
          echo "STATIC_COMPILE=PASS"
          python -m unittest discover -s tests -v 2>&1 | tee "${RUNNER_TEMP}/btube-step1-unittest.log"
          grep -F "Ran 103 tests" "${RUNNER_TEMP}/btube-step1-unittest.log"
          grep -Fx "OK" "${RUNNER_TEMP}/btube-step1-unittest.log"
          end_ns="$(date +%s%N)"
          awk -v s="$start_ns" -v e="$end_ns" 'BEGIN {printf "ELAPSED_SECONDS=%.3f\n", (e-s)/1000000000}'
          echo "STEP1_STATUS=PASS"

      - name: Step 2 — three boundary positives
        if: steps.launch.outputs.step == 'step2'
        working-directory: target/CERTIFICATES/prolate/item2_circle/b_tube_v2_1
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/btube-pycache-step2
        run: |
          set -Eeuo pipefail
          echo "BTUBE_GITHUB_VERIFICATION_STEP2_BOUNDARY_POSITIVES_V1"
          echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python - <<'PY'
          from fractions import Fraction
          from time import perf_counter
          from calibration_config import load_config
          from calibration_security import load_production_kernel
          from calibration_context import (
              ROUTED_BOUNDARY_ROUTE_ID,
              ROUTE_CONSISTENCY_TOL,
              ROUTE_CONSISTENCY_DEPTH,
              ROUTE_CONSISTENCY_LIMIT,
          )
          from exact_lambda_transport import ExactLambdaRoutedEvaluator
          from flint import arb, ctx

          config, _ = load_config()
          kernel, _ = load_production_kernel()
          ctx.dps = config["checker_dps"]
          ev = ExactLambdaRoutedEvaluator(kernel, arb, config)
          ev.set_phase("REHEARSAL_STEP2_BOUNDARY_POSITIVES")
          r = Fraction(63, 64)
          r_ball = arb(r.numerator) / arb(r.denominator)
          points = [
              ("lambda_start", Fraction(3307749, 1600000)),
              ("bridge_17_8", Fraction(17, 8)),
              ("lambda_end", Fraction(118, 25)),
          ]
          failed = False
          for name, lam in points:
              before = ev.boundary_evaluation_count
              t0 = perf_counter()
              try:
                  _, interval, _ = ev.evaluate_forced_exact_arb(
                      "F", r_ball, lam, lam, ROUTED_BOUNDARY_ROUTE_ID,
                      tol=ROUTE_CONSISTENCY_TOL,
                      depth=ROUTE_CONSISTENCY_DEPTH,
                      limit=ROUTE_CONSISTENCY_LIMIT,
                  )
                  elapsed = perf_counter() - t0
                  used = ev.boundary_evaluation_count - before
                  print(
                      f"POINT={name} STATUS=PASS r={r} lambda={lam} "
                      f"EVALUATIONS={used} ELAPSED_SECONDS={elapsed:.6f} "
                      f"ENCLOSURE_LO={interval.lo.as_fraction()} "
                      f"ENCLOSURE_HI={interval.hi.as_fraction()}"
                  )
              except Exception as exc:
                  elapsed = perf_counter() - t0
                  used = ev.boundary_evaluation_count - before
                  print(
                      f"POINT={name} STATUS=FAIL r={r} lambda={lam} "
                      f"EVALUATIONS={used} ELAPSED_SECONDS={elapsed:.6f} "
                      f"ERROR_TYPE={type(exc).__name__} ERROR={exc}"
                  )
                  failed = True
          print(f"BOUNDARY_EVALUATIONS_TOTAL={ev.boundary_evaluation_count}")
          if failed:
              raise SystemExit(3)
          PY
          echo "STEP2_STATUS=PASS"

      - name: Step 3 — A0B certificate construction
        if: steps.launch.outputs.step == 'step3'
        working-directory: target/CERTIFICATES/prolate/item2_circle/b_tube_v2_1
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/btube-pycache-step3
        run: |
          set -Eeuo pipefail
          echo "BTUBE_GITHUB_VERIFICATION_STEP3_A0B_V1"
          echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python - <<'PY'
          from time import perf_counter
          from calibration_config import load_config
          from calibration_security import load_production_kernel
          from a0b_start_anchor import build_a0b_start_anchor_certificate
          from exact_lambda_transport import ExactLambdaRoutedEvaluator, install_exact_lambda_call_sites
          from calibration_context import DyadicInterval
          from flint import arb, ctx

          config, _ = load_config()
          kernel, _ = load_production_kernel()
          ctx.dps = config["dps"]
          install_exact_lambda_call_sites()
          ev = ExactLambdaRoutedEvaluator(kernel, arb, config)
          ev.set_phase("A0B")

          def dump_trace():
              trace = [r for r in ev.trace if r.get("phase") == "A0B"]
              traced = 0
              print(f"A0B_TRACE_COUNT={len(trace)}")
              for i, rec in enumerate(trace):
                  detail = rec.get("detail") or {}
                  used = detail.get("boundary_route_evaluation_count") or 0
                  traced += used
                  iv = DyadicInterval.from_json(rec["enclosure"], f"trace.{i}")
                  reason = detail.get("refinement_accept_reason")
                  delta = detail.get("refinement_width_delta")
                  if rec.get("quantity") == "F_r":
                      hu_lo = -iv.hi.as_fraction()
                      hu_hi = -iv.lo.as_fraction()
                      extra = f" HU_LO={hu_lo} HU_HI={hu_hi}"
                  else:
                      extra = ""
                  print(
                      f"TRACE index={i} quantity={rec.get('quantity')} "
                      f"lambda={rec.get('lambda_interval')} r={rec.get('r_interval')} "
                      f"evaluations={used} predicate={detail.get('refinement_predicate_id')} "
                      f"accept_reason={reason} width_delta={delta} "
                      f"enclosure_lo={iv.lo.as_fraction()} "
                      f"enclosure_hi={iv.hi.as_fraction()}{extra}"
                  )
              print(f"TRACED_EVALUATIONS_SUM={traced}")
              print(f"CHARGED_UNTRACED_EVALUATIONS={ev.boundary_evaluation_count - traced}")

          t0 = perf_counter()
          rc = 0
          try:
              cert = build_a0b_start_anchor_certificate(config, ev, arb)
              print(f"A0B_ALL_PASSED={cert['all_passed']}")
              print(f"A0B_CANDIDATE_COUNT={cert['candidate_count']}")
              for entry in cert["entries"]:
                  print(
                      f"A0B_ENTRY index={entry['candidate_index']} "
                      f"passed={entry['passed']} "
                      f"failure_reason={entry['failure_reason']} "
                      f"evaluation_count={entry['evaluation_count']}"
                  )
              if cert["all_passed"] is not True:
                  rc = 3
          except Exception as exc:
              print("A0B_ALL_PASSED=UNAVAILABLE")
              print(f"A0B_EXCEPTION_TYPE={type(exc).__name__}")
              print(f"A0B_EXCEPTION={exc}")
              rc = 3
          finally:
              elapsed = perf_counter() - t0
              print(f"A0B_BOUNDARY_EVALUATION_COUNT={ev.boundary_evaluation_count}")
              print(f"A0B_BUILD_ELAPSED_SECONDS={elapsed:.6f}")
              dump_trace()
          raise SystemExit(rc)
          PY
          echo "STEP3_STATUS=PASS"

      - name: Verify target invariants
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="${{ steps.launch.outputs.target_head }}"
          actual="$(git -C target rev-parse HEAD)"
          status="$(git -C target status --porcelain=v1 --untracked-files=all)"
          echo "HEAD_AFTER=$actual"
          echo "TREE_AFTER=$(git -C target rev-parse 'HEAD^{tree}')"
          if [[ "$actual" = "$expected" && -z "$status" ]]; then
            echo "HEAD_INVARIANT=PASS"
            echo "TREE_INVARIANT=PASS"
          else
            echo "HEAD_INVARIANT=FAIL"
            printf 'TREE_INVARIANT=FAIL status=%q\n' "$status"
            exit 4
          fi
