name: B-LOCAL v2.2 v5 J_START conditions 5-6 diagnostic
# Authorized corrected derivative-ladder run

on:
  push:
    branches: [agent/blocal-v22-method-selection-taylor2]
    paths: ['.github/workflows/blocal-v22-v5-jstart-conditions-5-6.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 2a25bc9d675dc84626457b7ee2c628f46c340a6a
  V5_SHA256: 7b4f9b394caeafd4edce4d549819f98178b7e107e96370031e92ba9f2a1331ce
  CONFIG_SHA256: fec14e9911102f6d2c1d6d389a21865e16ffcdb91aa08adb69f13da45d3717d6
  BLOCAL_DIR: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
  DIAG_DIR: CERTIFICATES/prolate/item2_circle/b_tube_v2_1/diagnostics
  RECORD: /tmp/blocal-v22-v5-jstart-s9-u8.json
  RECORD_GZ: /tmp/blocal-v22-v5-jstart-s9-u8.json.gz

jobs:
  jstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2a25bc9d675dc84626457b7ee2c628f46c340a6a
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install pinned Arb runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0

      - name: Static exact audits
        shell: bash
        working-directory: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
        run: |
          set -euo pipefail
          python blocal_v22_static_test.py
          python blocal_v22_symbolic_audit.py

      - name: Run v5 J_START conditions 5 and 6
        shell: bash
        run: |
          set -euo pipefail
          timeout 1200s python - <<'PY'
          import gzip,hashlib,json,os,platform,subprocess,sys,time
          from fractions import Fraction
          from pathlib import Path

          root=Path.cwd();bd=root/os.environ['BLOCAL_DIR'];dd=root/os.environ['DIAG_DIR']
          sys.path.insert(0,str(dd));sys.path.insert(0,str(bd))
          source=subprocess.run(['git','rev-parse','HEAD'],check=True,capture_output=True,text=True).stdout.strip()
          paths={'v5':dd/'blocal_v22_method_taylor2_probe_v5.py',
                 'config':bd/'config.blocal-v2.2-run.json'}
          actual={'checkout_sha':source,
                  'v5_sha256':hashlib.sha256(paths['v5'].read_bytes()).hexdigest(),
                  'config_sha256':hashlib.sha256(paths['config'].read_bytes()).hexdigest()}
          expected={'checkout_sha':os.environ['SOURCE_SHA'],
                    'v5_sha256':os.environ['V5_SHA256'],
                    'config_sha256':os.environ['CONFIG_SHA256']}
          started=time.perf_counter()
          record={'schema':'BLOCAL_V22_V5_JSTART_S9_U8_V1',
                  'expected_provenance':expected,'actual_provenance':actual,
                  'lambda_increment':{'numerator':1,'denominator':512,'power':-9},
                  'u_max':{'numerator':1,'denominator':256,'power':-8},
                  'materialized_ephemeral_config_sha256':None,
                  'materialization_inputs':None,'certificate_evidence':False}
          try:
            if actual!=expected:raise RuntimeError('PINNED_PROVENANCE_MISMATCH')
            import blocal_v22_method_taylor2_probe_v5 as v5
            base=v5.base;v2=v5.v4.v3.v2;v3=v5.v4.v3
            import blocal_v22_checker_test as ct
            committed=json.loads(paths['config'].read_bytes())
            cfg=ct.config()
            for key in ('stage1_dependency','kernel','adapter','base_v21','outputs'):cfg[key]=committed[key]
            names=['blocal_v22_policy.py','blocal_v22_model.py','blocal_v22_boundary.py','blocal_v22_checker.py','blocal_v22_checker_test.py','blocal_v22_runner.py','blocal_v22_static_test.py','blocal_v22_symbolic_audit.py','blocal_v22_readiness_test.py']
            prefix='CERTIFICATES/prolate/item2_circle/b_tube_v2_1/'
            native_hashes={prefix+n:hashlib.sha256((bd/n).read_bytes()).hexdigest() for n in names}
            cfg['implementation']={'entrypoint_path':prefix+'blocal_v22_runner.py','sources_sha256':native_hashes}
            cfg['checker']={'id':base.model.CHECKER_ID,'path':prefix+'blocal_v22_checker.py','source_sha256':native_hashes[prefix+'blocal_v22_checker.py']}
            cfg['symbolic_audit']={'id':base.model.SYMBOLIC_AUDIT_ID,'path':prefix+'blocal_v22_symbolic_audit.py','source_sha256':native_hashes[prefix+'blocal_v22_symbolic_audit.py']}
            base.model.validate_config(cfg)
            materialized=base.model.canonical_json_bytes(cfg)
            record['materialized_ephemeral_config_sha256']=hashlib.sha256(materialized).hexdigest()
            record['materialization_inputs']={'checker_test_sha256':native_hashes[prefix+'blocal_v22_checker_test.py'],
              'model_sha256':native_hashes[prefix+'blocal_v22_model.py'],'native_nine_sha256':native_hashes}

            from flint import acb,arb,ctx,fmpq
            import flint
            ctx.prec=cfg['precision']['bits'];base.CONFIG=cfg;base.acb=acb;base.arb=arb;base.fmpq=fmpq
            base.route,base.adapter,base.kernel=base.readiness.load(cfg)
            v2.BUDGET=dict(v2.BUDGET);v2.BUDGET['max_depth']=16;base.BUDGET=v2.BUDGET
            base.angle4_union=v2.angle4_union;base.geometry_jet=v5.geometry_jet;base.eval_cell=v5.eval_cell
            base.enclose=v2.enclose;base.jstart=v2.jstart
            floor_site_counts={}
            _effective=v5.effective
            def tracked_effective(site,structural,x,w,region,scope,cell):
              out=_effective(site,structural,x,w,region,scope,cell)
              source=v5._REGISTRY[out[1]]['selected_source']
              z=floor_site_counts.setdefault(site,{'calls':0,'natural':0,'structural':0})
              z['calls']+=1;z[source]+=1
              return out
            v5.effective=tracked_effective

            def refined_jstart(lam,um,run_start):
              model=base.model;left=Fraction(1)-um;right=Fraction(1)
              points=[];steps=[];f_outer=0;derivative_evaluations=0
              full_cond5=None
              def fail(reason,extra=None):
                path={'phase':'J_START_COMPLETE_PATH',
                  'tested_domain':{'initial_bracket':model.interval_json(Fraction(1)-um,Fraction(1)),
                    'lambda_start':model.rational_json(lam)},
                  'strict_predicate':'ordered strict signs when continuation is needed + targeted F_r<0 + strict interval-Newton self-containment',
                  'predicate_result':False,'ordered_bisection':points,'newton_steps':steps,
                  'outer_evaluations':f_outer,
                  'evaluation_accounting':{'j_start_outer_budget_applies_to':'F_POINT_ENCLOSURES_ONLY',
                    'f_point_outer_evaluations':f_outer,'derivative_evaluations':derivative_evaluations,
                    'derivative_evaluations_budget':'SEPARATE_RECORDED_COUNTER'},
                  'failure_reason':reason,'certificate_evidence':False}
                if extra:path.update(extra)
                return path,full_cond5
              try:
                fleft,fd=base.f_enclose(left,left,lam,lam,'POS',run_start);f_outer+=1
                points.append({'r':model.rational_json(left),'sign':'POS','enclosure':fleft,
                  'role':'INITIAL_LEFT','evaluation_subdivision_counts':fd})
                s=lam-model.LAMBDA_PLUS
                hu_full,hd_full=base.hu_enclose(Fraction(0),um,s,s,'POS',run_start)
                derivative_evaluations+=hd_full['cell_evaluation_attempts']
                Dfull=model.interval_negate(hu_full)
                dlo,dhi=model.interval_fractions(Dfull,'full derivative')
                model.need(dhi<0 and not(dlo<=0<=dhi),'full Fr negative')
                full_cond5={'phase':'J_START_DERIVATIVE_BRACKET',
                  'tested_domain':{'r_interval':model.interval_json(Fraction(1)-um,Fraction(1)),
                    'u_interval':model.interval_json(Fraction(0),um),
                    'lambda_start':model.rational_json(lam)},
                  'coordinate_map':{'exact':'u=1-r','r_left_maps_to_u_right':True,
                    'r_right_maps_to_u_left':True},
                  'H_u':hu_full,'final_enclosure':Dfull,
                  'endpoint_transform':{'exact_relation':'F_r=-H_u',
                    'rule':'[H_lo,H_hi] maps to [-H_hi,-H_lo]','label_only':False},
                  'strict_predicate':'0 notin F_r and sup(F_r)<0','predicate_result':True,
                  'evaluation_subdivision_counts':hd_full,
                  'derivative_evaluations':hd_full['cell_evaluation_attempts'],
                  'failure_reason':None,'certificate_evidence':False}
                for k in range(v2.BUDGET['j_start_max_bisections']):
                  if f_outer>=v2.BUDGET['j_start_max_outer_evaluations']:
                    return fail('J_OUTER_BUDGET')
                  before_left,before_right=left,right;m=(left+right)/2
                  width=right-left
                  u0,u1=Fraction(1)-right,Fraction(1)-left
                  target_ladder=[Fraction(6,5),Fraction(1),Fraction(1,2),Fraction(1,4),Fraction(1,10)]
                  target_trials=[];theta=None;hu=None;hd=None
                  original_cell_budget=v2.BUDGET['max_cell_evaluations_per_enclosure']
                  try:
                    for candidate in target_ladder:
                      v2.BUDGET['max_cell_evaluations_per_enclosure']=3000
                      def derivative_accept(H,target=candidate):
                        hlo,_=model.interval_fractions(H,'targeted H_u')
                        return hlo>=target
                      try:
                        hu,hd=base.enclose('H_U',u0,u1,s,s,'CUSTOM',run_start,derivative_accept)
                        used=hd['cell_evaluation_attempts'];derivative_evaluations+=used
                        target_trials.append({'target':model.rational_json(candidate),
                          'status':'REACHED','cell_evaluation_attempts':used})
                        theta=candidate;break
                      except v2.Failure as exc:
                        used=exc.counts.get('cell_evaluation_attempts',0);derivative_evaluations+=used
                        target_trials.append({'target':model.rational_json(candidate),
                          'status':'NOT_REACHED','failure_reason':str(exc),
                          'cell_evaluation_attempts':used})
                    if theta is None:
                      v2.BUDGET['max_cell_evaluations_per_enclosure']=original_cell_budget
                      hu,hd=base.hu_enclose(u0,u1,s,s,'POS',run_start)
                      used=hd['cell_evaluation_attempts'];derivative_evaluations+=used
                      target_trials.append({'target':None,'status':'SIGN_ONLY_FALLBACK_REACHED',
                        'cell_evaluation_attempts':used})
                  except v2.Failure as exc:
                    derivative_evaluations+=exc.counts.get('cell_evaluation_attempts',0)
                    return fail('DERIVATIVE_'+str(exc),{'failed_step':k,
                      'failed_derivative_counts':exc.counts,
                      'derivative_target_trials':target_trials})
                  finally:
                    v2.BUDGET['max_cell_evaluations_per_enclosure']=original_cell_budget
                  D=model.interval_negate(hu);dlo,dhi=model.interval_fractions(D,'step derivative')
                  model.need(dhi<0 and not(dlo<=0<=dhi),'step Fr negative')
                  if theta is not None:model.need(dhi<=-theta,'targeted step Fr lower bound')
                  def newton_data(Fm):
                    qlo,qhi=model.interval_divide_negative_denominator(Fm,D)
                    nlo,nhi=m-qhi,m-qlo
                    return qlo,qhi,nlo,nhi,left<nlo<=nhi<right
                  def f_accept(Fm):
                    try:
                      if base.sign(Fm) in ('POS','NEG'):return True
                    except Exception:pass
                    try:return newton_data(Fm)[4]
                    except Exception:return False
                  try:
                    fm,fmd=base.f_enclose(m,m,lam,lam,'CUSTOM',run_start,f_accept);f_outer+=1
                  except v2.Failure as exc:
                    f_outer+=1
                    return fail('F_POINT_'+str(exc),{'failed_step':k,
                      'failed_F_counts':exc.counts,'failed_midpoint':model.rational_json(m),
                      'derivative_lower_target_reached':None if theta is None else model.rational_json(theta),
                      'derivative_target_trials':target_trials,
                      'step_derivative':D,'step_H_u':hu,
                      'step_derivative_counts':hd})
                  qlo,qhi,nlo,nhi,contained=newton_data(fm)
                  sg=base.sign(fm)
                  flo,fhi=model.interval_fractions(fm,'step Fm')
                  sign_strict=sg in ('POS','NEG')
                  step={'index':k,'bracket_before':model.interval_json(before_left,before_right),
                    'midpoint':model.rational_json(m),'F_midpoint':fm,'F_sign':sg,
                    'strict_sign_certified':sign_strict,
                    'sign_required_for_continuation':not contained,
                    'F_stop_reason':'NEWTON_CONTAINMENT' if contained else 'STRICT_SIGN',
                    'F_evaluation_subdivision_counts':fmd,
                    'u_derivative_domain':model.interval_json(u0,u1),
                    'derivative_lower_target_reached':None if theta is None else model.rational_json(theta),
                    'derivative_target_trials':target_trials,
                    'derivative_target_attempt_cap':3000,
                    'coordinate_map':{'exact':'u=1-r',
                      'u_lo_equals':'1-r_right','u_hi_equals':'1-r_left'},
                    'H_u':hu,'F_r':D,
                    'endpoint_transform':{'exact_relation':'F_r=-H_u',
                      'rule':'[H_lo,H_hi] maps to [-H_hi,-H_lo]','label_only':False},
                    'derivative_evaluation_subdivision_counts':hd,
                    'division':{'operation':'F(midpoint)/F_r(X)',
                      'negative_denominator_preserved':True,
                      'denominator_endpoints':{'lo':model.rational_json(dlo),'hi':model.rational_json(dhi)},
                      'reciprocal_endpoint_rule':'[1/F_r_hi,1/F_r_lo]',
                      'numerator_endpoints':{'lo':model.rational_json(flo),'hi':model.rational_json(fhi)},
                      'quotient':model.outward_dyadic(qlo,qhi)},
                    'quotient':model.outward_dyadic(qlo,qhi),
                    'newton_image':model.outward_dyadic(nlo,nhi),
                    'containment_margins':{'left':model.rational_json(nlo-left),
                      'right':model.rational_json(right-nhi)},
                    'strict_self_containment':contained}
                  steps.append(step)
                  if contained:
                    path={'phase':'J_START_COMPLETE_PATH',
                      'tested_domain':{'initial_bracket':model.interval_json(Fraction(1)-um,Fraction(1)),
                        'lambda_start':model.rational_json(lam)},
                      'strict_predicate':'ordered strict signs when continuation is needed + targeted F_r<0 + strict interval-Newton self-containment',
                      'predicate_result':True,'ordered_bisection':points,'derivative':full_cond5,
                      'newton_steps':steps,'newton':step,'outer_evaluations':f_outer,
                      'bisection_attempts':len(steps),
                      'evaluation_accounting':{'j_start_outer_budget_applies_to':'F_POINT_ENCLOSURES_ONLY',
                        'f_point_outer_evaluations':f_outer,
                        'derivative_evaluations':derivative_evaluations,
                        'derivative_evaluations_budget':'SEPARATE_RECORDED_COUNTER'},
                      'failure_reason':None,'certificate_evidence':False}
                    return path,full_cond5
                  if not sign_strict:return fail('BISECTION_UNRESOLVED')
                  if sg=='NEG':right=m;role='RETAINED_RIGHT'
                  else:left=m;role='RETAINED_LEFT'
                  points.append({'r':model.rational_json(m),'sign':sg,'enclosure':fm,'role':role})
                return fail('MAX_BISECTIONS')
              except v2.Failure as exc:return fail('ENCLOSURE_'+str(exc),{'failure_counts':exc.counts})
              except Exception as exc:return fail(type(exc).__name__+':'+str(exc))

            v2._TRACE=None;v2._HISTORY=[];v2._LAST_COUNTS=None
            s=Fraction(1,512);um=Fraction(1,256);lam=base.model.LAMBDA_PLUS+s
            path,cond5=refined_jstart(lam,um,time.perf_counter())
            path=v3.compact(path);cond5=v3.compact(cond5)
            ordered=path.get('ordered_bisection',[]) if isinstance(path,dict) else []
            derivative=None if cond5 is None else cond5.get('final_enclosure')
            derivative_strict=False
            if derivative is not None:
              dlo,dhi=base.model.interval_fractions(derivative,'record derivative')
              derivative_strict=dhi<0 and not (dlo<=0<=dhi)
            newton=path.get('newton',{}) if isinstance(path,dict) else {}
            checks={
              'complete_path_pass':bool(path and path.get('predicate_result')),
              'derivative_bracket_pass':bool(cond5 and cond5.get('predicate_result')),
              'ordered_points_strict_sign':bool(ordered) and all(x.get('sign') in {'POS','NEG'} for x in ordered),
              'derivative_sup_negative_and_zero_excluded':derivative_strict,
              'negative_denominator_quotient_recorded':derivative_strict and newton.get('division',{}).get('quotient') is not None,
              'newton_strict_self_containment':newton.get('strict_self_containment') is True,
              'outer_evaluations_le_96':isinstance(path,dict) and path.get('outer_evaluations',97)<=96,
              'bisections_le_40':isinstance(path,dict) and len(path.get('newton_steps',[]))<=40,
            }
            status='PASS' if all(checks.values()) else 'FAIL'
            record.update({'status':status,'checks':checks,'declared_budgets':dict(v2.BUDGET),
              'lambda_start':base.model.rational_json(lam),'jstart_complete_path':path,
              'jstart_derivative_bracket':cond5,
              'runtime':{'python':sys.version.split()[0],'python_flint':flint.__version__,'platform':platform.platform()},
              'v5_floor_registry_bounded':(lambda items:{
                'unique_count':len(items),
                'total_use_count':v5._STATS['effective_floor_calls'],
                'canonical_sha256':hashlib.sha256(json.dumps({k:v5._REGISTRY[k] for k in sorted(v5._REGISTRY)},sort_keys=True,separators=(',',':')).encode()).hexdigest(),
                'retained_limit':64,'retained':{k:v5._REGISTRY[k] for k in sorted(v5._REGISTRY)[:64]},
                'truncated':len(items)>64,'omitted_count':max(0,len(items)-64),
                'per_site':{k:floor_site_counts[k] for k in sorted(floor_site_counts)}})(sorted(v5._REGISTRY)),
              'v5_floor_counters':v5._STATS})
          except Exception as exc:
            record.update({'status':'INFRASTRUCTURE_FAILURE','reason':type(exc).__name__+':'+str(exc)})
          record['elapsed_seconds']=f'{time.perf_counter()-started:.6f}'
          payload=json.dumps(record,sort_keys=True,separators=(',',':')).encode()+b'\n'
          out=Path(os.environ['RECORD']);out.write_bytes(payload)
          with gzip.open(os.environ['RECORD_GZ'],'wb',compresslevel=9) as fh:fh.write(payload)
          print(json.dumps({'status':record['status'],'checks':record.get('checks'),
            'record_bytes':len(payload),'record_sha256':hashlib.sha256(payload).hexdigest(),
            'elapsed_seconds':record['elapsed_seconds']},sort_keys=True,separators=(',',':')))
          if record['status']!='PASS':raise SystemExit(1)
          PY

      - name: Upload J_START record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blocal-v22-v5-jstart-s9-u8
          path: /tmp/blocal-v22-v5-jstart-s9-u8.json.gz
          if-no-files-found: error
          retention-days: 30
