name: Prolate Item 3 Lambda Sweep

on:
  push:
    tags:
      - "item3-sweep-run-*"

permissions:
  contents: read
  actions: read

concurrency:
  group: item3-sweep-${{ github.sha }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Verify tag suffix equals commit SHA (pre-checkout)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          case "$GITHUB_REF" in
            refs/tags/item3-sweep-run-*) ;;
            *) exit 64 ;;
          esac
          TAG_SUFFIX="${GITHUB_REF#refs/tags/item3-sweep-run-}"
          printf '%s' "$TAG_SUFFIX" | grep -Eq '^[0-9a-f]{40}$'
          test "$TAG_SUFFIX" = "$GITHUB_SHA"

      - name: Checkout immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
          path: source

      - name: Verify checked-out HEAD equals commit SHA (post-checkout)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install hash-pinned Python-FLINT wheel
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          REQ="CERTIFICATES/prolate/item3_center_connection/lambda_sweep/production/requirements-python-flint.txt"
          test -f "$REQ"
          python3 -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r "$REQ"
          python3 - <<'PY'
          import importlib.metadata
          import flint
          assert importlib.metadata.version("python-flint") == "0.9.0"
          assert hasattr(flint, "arb") and hasattr(flint, "acb")
          PY

      - name: Independent design and audited-source gate
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="CERTIFICATES/prolate/item3_center_connection/lambda_sweep/design_contract_v8_1.md"
          PHASE3="CERTIFICATES/prolate/item3_center_connection/lambda_sweep/phase3_impl"
          PROD="CERTIFICATES/prolate/item3_center_connection/lambda_sweep/production"
          test "$(git hash-object "$DESIGN")" = "cafbf7b661911995008dda49bfb3ecabcecb1f12"
          test -f "$PHASE3/SOURCE_MANIFEST.json"
          (
            cd "$PHASE3"
            PYTHONPATH=. python3 run_phase3_tests.py
            python3 static_audit.py
            python3 run_phase3_fixture_bridge.py --phase2-dir ../phase2_selftest
          )
          python3 "$PROD/audit_config_draft.py"
          python3 "$PROD/audit_production_source.py"
          python3 "$PROD/test_production_source.py"

      - name: Download and rederive canonical pilot artifact
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="8680673043"
          ARTIFACT_SHA256="c0f624a955657f906c09c45b016a92f7bcdfa70d26c2508efeb3f06dd7d27381"
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          rm -rf pilot-artifact pilot-artifact.zip pilot-artifact-verification.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API" -o pilot-artifact.zip
          printf '%s  %s\n' "$ARTIFACT_SHA256" pilot-artifact.zip | sha256sum -c -
          mkdir pilot-artifact
          unzip -q pilot-artifact.zip -d pilot-artifact
          python3 CERTIFICATES/prolate/item3_center_connection/lambda_sweep/production/verify_pilot_artifact.py \
            --artifact-zip pilot-artifact.zip \
            --artifact-dir pilot-artifact \
            --write-report pilot-artifact-verification.json

      - name: Require approved production inputs
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          PROD="CERTIFICATES/prolate/item3_center_connection/lambda_sweep/production"
          CONFIG="$PROD/config.item3-sweep-run.json"
          CONFIG_SHA="$PROD/config.item3-sweep-run.sha256"
          ENTRY="$PROD/run_item3_sweep.py"
          test -f "$CONFIG"
          test -f "$CONFIG_SHA"
          test -f "$ENTRY"
          test -f "$PROD/arb_adapter.py"
          test -f "$PROD/verify_pilot_artifact.py"
          test -f "$PROD/TARGET_RANGE_POLICY.json"
          test "$(sha256sum "$CONFIG" | cut -d' ' -f1)" = "$(tr -d '\n' < "$CONFIG_SHA")"

      - name: Execute production sweep
        working-directory: source
        shell: bash
        env:
          ITEM3_SWEEP_GITHUB_RUN_ID: ${{ github.run_id }}
          ITEM3_SWEEP_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          ITEM3_SWEEP_GITHUB_SHA: ${{ github.sha }}
          ITEM3_SWEEP_GITHUB_REF: ${{ github.ref }}
        run: |
          set -uo pipefail
          PROD="CERTIFICATES/prolate/item3_center_connection/lambda_sweep/production"
          rm -rf item3-sweep-output

          set +e
          python3 "$PROD/run_item3_sweep.py" \
            --config "$PROD/config.item3-sweep-run.json" \
            --config-sha256 "$PROD/config.item3-sweep-run.sha256" \
            --pilot-artifact-zip pilot-artifact.zip \
            --pilot-artifact-dir pilot-artifact \
            --output item3-sweep-output
          runner_rc=$?
          set -e

          mkdir -p item3-sweep-output
          printf '%s\n' "$runner_rc" \
            > item3-sweep-output/RUNNER_EXIT_CODE.txt

          missing_file=0
          : > item3-sweep-output/MISSING_EXPECTED_FILES.txt
          for required in \
            item3-sweep-output/SWEEP_RUN_MANIFEST.json \
            item3-sweep-output/SWEEP_RECORDS.jsonl \
            item3-sweep-output/SWEEP_EVIDENCE.json \
            item3-sweep-output/SWEEP_CHECKER_REPORT.json \
            item3-sweep-output/PILOT_ARTIFACT_REDERIVATION.json
          do
            if [[ ! -f "$required" ]]; then
              printf '%s\n' "$required" \
                >> item3-sweep-output/MISSING_EXPECTED_FILES.txt
              missing_file=1
            fi
          done

          if (( runner_rc != 0 )); then
            exit "$runner_rc"
          fi
          if (( missing_file != 0 )); then
            exit 86
          fi

      - name: Upload immutable run artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: item3-sweep-${{ github.run_id }}-${{ github.sha }}
          path: source/item3-sweep-output
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
          include-hidden-files: false
