name: Item 3 v9 three-leaf requalification dispatch

on:
  push:
    branches:
      - agent/item3-v9-analytic-proof
    paths:
      - ".github/workflows/item3-v9-three-leaf-requalification-dispatch.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch unchanged performance qualification v2 workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['REPOSITORY']
          token=os.environ['GH_TOKEN']
          url=f"https://api.github.com/repos/{repo}/actions/workflows/item3-v9-performance-qualification-v2.yml/dispatches"
          body=json.dumps({'ref':'agent/item3-v9-analytic-proof'}).encode()
          req=urllib.request.Request(url,data=body,method='POST',headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'item3-v9-three-leaf-requalification-dispatch',
              'Content-Type':'application/json',
          })
          with urllib.request.urlopen(req,timeout=30) as resp:
              if resp.status != 204:
                  raise SystemExit(f'unexpected dispatch status {resp.status}')
          print('PERFORMANCE_V2_DISPATCH=ACCEPTED')
          PY
