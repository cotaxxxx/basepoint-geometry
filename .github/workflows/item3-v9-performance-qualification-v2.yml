name: Item 3 v9 performance qualification v2

on:
  push:
    branches:
      - agent/item3-v9-analytic-proof
    paths:
      - ".github/workflows/item3-v9-performance-qualification-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: item3-v9-performance-qualification-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate
  CONFIG: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/rehearsal_bundle_candidate_v2/plan_config/rehearsal_shard_config_v1.json
  PLAN: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/rehearsal_bundle_candidate_v2/plan_config/rehearsal_plan_v2.json
  DEPS: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/rehearsal_bundle_candidate_v2/dependencies/dependency_snapshot_v9_candidate.json
  VALIDATION: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_corpus_v2/VALIDATION_REPORT.json
  VALIDATION_ENV: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_corpus_v2/VALIDATION_ENVIRONMENT.json
  VALIDATOR: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_corpus_v2/run_validation_corpus_v2.py
  REFERENCE: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_corpus_v2/independent_reference_v2.py
  VALIDATION_WORKFLOW: .github/workflows/item3-v9-256-leaf-validation-v2.yml
  WORKFLOW_PATH: .github/workflows/item3-v9-performance-qualification-v2.yml

jobs:
  full_path:
    name: full-path repetition ${{ matrix.repetition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
      - name: Install pinned validated arithmetic
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0

      - name: Verify successor identity and independent validation gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          validation=load(os.environ['VALIDATION']); venv=load(os.environ['VALIDATION_ENV'])
          if validation.get('status')!='PASSED' or validation.get('failure_count')!=0 or validation.get('leaf_count')!=256:
              raise SystemExit('256-leaf validation v2 gate not PASSED')
          if validation.get('failed_control_ids') or validation.get('missing_control_ids') or validation.get('extra_control_ids'):
              raise SystemExit('validation v2 ID set is not exact')
          if sha(os.environ['VALIDATOR'])!=validation['validation_source_sha256']: raise SystemExit('validator source drift')
          if sha(os.environ['REFERENCE'])!=validation['independent_reference_sha256']: raise SystemExit('independent reference drift')
          if sha(os.environ['VALIDATION_WORKFLOW'])!=venv['workflow_sha256']: raise SystemExit('validation workflow drift')
          if venv.get('flint_library')!='3.6.0' or venv.get('python_flint')!='0.9.0': raise SystemExit('validation arithmetic provenance mismatch')
          expected=validation['target_bundle']
          observed={'config_sha256':sha(os.environ['CONFIG']),'plan_sha256':sha(os.environ['PLAN']),'dependency_snapshot_sha256':sha(os.environ['DEPS'])}
          if observed!={k:expected[k] for k in observed}: raise SystemExit(f'successor bundle drift: {observed}')
          cfg=load(os.environ['CONFIG']); plan=load(os.environ['PLAN']); deps=load(os.environ['DEPS'])
          for name,obj,key in [('config',cfg,'source_sha256'),('plan',plan,'source_sha256'),('deps',deps,'machine_source_sha256')]:
              if obj[key]!=expected['source_sha256']: raise SystemExit(f'{name} source map drift')
          print('SUCCESSOR_QUALIFICATION_IDENTITY=PASS')
          PY

      - name: Record exact environment and wheel identity
        env:
          REPETITION: ${{ matrix.repetition }}
        shell: bash
        run: |
          set -euo pipefail
          REP_DIR="perf-v2-rep-${REPETITION}"
          mkdir -p "$REP_DIR/wheel"
          python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps python-flint==0.9.0 -d "$REP_DIR/wheel" >/dev/null
          python - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          import flint
          rep=os.environ['REPETITION']; root=Path(f'perf-v2-rep-{rep}')
          wheel=next((root/'wheel').glob('python_flint-*.whl'))
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          cfg=json.loads(Path(os.environ['CONFIG']).read_text(encoding='utf-8'))
          validation=json.loads(Path(os.environ['VALIDATION']).read_text(encoding='utf-8'))
          venv=json.loads(Path(os.environ['VALIDATION_ENV']).read_text(encoding='utf-8'))
          cpu='UNKNOWN'; cpuinfo=Path('/proc/cpuinfo')
          if cpuinfo.exists():
              for line in cpuinfo.read_text(errors='replace').splitlines():
                  if line.lower().startswith('model name'): cpu=line.split(':',1)[1].strip(); break
          mem=None; meminfo=Path('/proc/meminfo')
          if meminfo.exists():
              for line in meminfo.read_text().splitlines():
                  if line.startswith('MemTotal:'): mem=int(line.split()[1]); break
          report={
              'schema':'ITEM3_SWEEP_V9_PERFORMANCE_ENVIRONMENT_V2','repetition':int(rep),
              'github_run_id':os.environ.get('GITHUB_RUN_ID'),'github_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'github_sha':os.environ.get('GITHUB_SHA'),'github_ref':os.environ.get('GITHUB_REF'),
              'runner_os':os.environ.get('RUNNER_OS'),'runner_arch':os.environ.get('RUNNER_ARCH'),'runner_name':os.environ.get('RUNNER_NAME'),'image_os':os.environ.get('ImageOS'),'image_version':os.environ.get('ImageVersion'),
              'cpu_model':cpu,'logical_cpu_count':os.cpu_count(),'memory_total_kib':mem,'python':platform.python_version(),
              'python_flint':getattr(flint,'__version__','UNKNOWN'),'flint_library':getattr(flint,'__FLINT_VERSION__','UNKNOWN'),
              'python_flint_wheel':wheel.name,'python_flint_wheel_sha256':sha(wheel),'workflow_sha256':sha(os.environ['WORKFLOW_PATH']),
              'config_sha256':sha(os.environ['CONFIG']),'aggregate_plan_sha256':sha(os.environ['PLAN']),'dependency_snapshot_sha256':sha(os.environ['DEPS']),
              'design_sha256':cfg['design_sha256'],'source_sha256':cfg['source_sha256'],'validation_report_sha256':sha(os.environ['VALIDATION']),
              'validation_source_sha256':validation['validation_source_sha256'],'independent_reference_sha256':validation['independent_reference_sha256'],'validation_workflow_sha256':venv['workflow_sha256'],
          }
          if report['python']!='3.13.14' or report['python_flint']!='0.9.0' or report['flint_library']!='3.6.0':
              raise SystemExit(f'arithmetic environment mismatch: {report}')
          (root/'PERFORMANCE_ENVIRONMENT.json').write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(report,sort_keys=True))
          PY

      - name: Execute complete qualification path and prepare artifact
        env:
          REPETITION: ${{ matrix.repetition }}
        shell: bash
        run: |
          set -uo pipefail
          REP_DIR="perf-v2-rep-${REPETITION}"
          OUT="$REP_DIR/output"
          mkdir -p "$OUT"
          start_ns=$(date +%s%N)
          set +e
          /usr/bin/time -v -o "$REP_DIR/RESOURCE_USAGE.txt" \
            python "$BASE/rehearsal_driver_v9_candidate_v3.py" \
              --checkout-root . --config "$CONFIG" --output-dir "$OUT" --qualification-mode \
              > "$REP_DIR/DRIVER_STDOUT.log" 2> "$REP_DIR/DRIVER_STDERR.log"
          rc=$?
          set -e
          tar -C "$OUT" -cf "$REP_DIR/qualification_payload.tar" .
          end_ns=$(date +%s%N)
          printf '%s\n' "$rc" > "$REP_DIR/DRIVER_EXIT_CODE.txt"
          printf '%s\n' "$start_ns" > "$REP_DIR/COMPLETE_PATH_START_NS.txt"
          printf '%s\n' "$end_ns" > "$REP_DIR/COMPLETE_PATH_END_NS.txt"

      - name: Verify full-path and separated checkpoint provenance
        env:
          REPETITION: ${{ matrix.repetition }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,importlib.util,json,os,re,sys
          from pathlib import Path
          rep=int(os.environ['REPETITION']); root=Path(f'perf-v2-rep-{rep}'); out=root/'output'
          start=int((root/'COMPLETE_PATH_START_NS.txt').read_text()); end=int((root/'COMPLETE_PATH_END_NS.txt').read_text()); wall=(end-start)/1e9
          rc=int((root/'DRIVER_EXIT_CODE.txt').read_text())
          ep=out/'SHARD_EVIDENCE_CANDIDATE.json'; pp=out/'SHARD_PROVENANCE.json'; tp=out/'SHARD_TIMING_DIAGNOSTIC.json'
          evidence=json.loads(ep.read_text()) if ep.exists() else {}; provenance=json.loads(pp.read_text()) if pp.exists() else {}; timing=json.loads(tp.read_text()) if tp.exists() else {}
          runner=evidence.get('runner_result') or {}; checker=evidence.get('checker_report') or {}
          src=Path(os.environ['BASE'])/'checkpoint_v9_candidate.py'; spec=importlib.util.spec_from_file_location(f'perf_v2_checkpoint_{rep}',src); mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          recovered=[]; last_sha=None; chain_ok=False
          try:
              recovered=mod.recover_committed(out/'checkpoint'); last_sha=recovered[-1].checkpoint_sha256 if recovered else None
              ledger=out/'checkpoint'/'SWEEP_PROGRESS.jsonl'; evidence_sha=hashlib.sha256(ep.read_bytes()).hexdigest(); ledger_sha=hashlib.sha256(ledger.read_bytes()).hexdigest()
              chain_ok=bool(recovered) and provenance.get('schema')=='ITEM3_SWEEP_V9_SHARD_PROVENANCE_V1' and provenance.get('proof_status')=='PROVENANCE_ONLY' and provenance.get('authorization')=='QUALIFICATION_ONLY' and provenance.get('shard_evidence_sha256')==evidence_sha and provenance.get('checkpoint_commit_count')==len(recovered) and provenance.get('checkpoint_last_sha256')==last_sha and provenance.get('checkpoint_ledger_sha256')==ledger_sha
          except Exception: chain_ok=False
          leaves=runner.get('accepted_leaves') or []; attempts=runner.get('attempts') or []
          fresh=checker.get('status')=='PASS_CANDIDATE' and checker.get('reason')=='DPS50_REPLAY_AND_DPS70_VERIFY_PASS' and checker.get('dps50_leaf_count')==checker.get('dps70_verified_leaf_count')==len(leaves)
          mathematical=rc==0 and evidence.get('schema')=='ITEM3_SWEEP_V9_SHARD_EVIDENCE_CANDIDATE_V2' and evidence.get('status')=='QUALIFICATION_PASS_CANDIDATE' and evidence.get('authorization')=='QUALIFICATION_ONLY' and runner.get('terminal_class')=='COMPLETE_CANDIDATE' and fresh
          no_stop=mathematical and all(a.get('reason')!='NO_SPLITTABLE_AXIS' for a in attempts)
          cpsec=float(timing.get('checkpoint_wall_seconds') or 0.0); overhead=cpsec/wall if wall>0 else 1.0
          artifact=(root/'qualification_payload.tar').is_file() and (root/'qualification_payload.tar').stat().st_size>0
          hard=wall<10800.0; overhead_gate=overhead<=0.05
          counted=all([mathematical,no_stop,chain_ok,fresh,artifact,hard,overhead_gate])
          rs=sum(1 for a in attempts if a.get('selected_axis')=='r'); ls=sum(1 for a in attempts if a.get('selected_axis')=='lambda')
          maxr=max([int(a.get('r_depth',0)) for a in attempts],default=0); maxl=max([int(a.get('lambda_depth',0)) for a in attempts],default=0)
          resource=(root/'RESOURCE_USAGE.txt').read_text(errors='replace'); m=re.search(r'Maximum resident set size \(kbytes\):\s*(\d+)',resource); peak=int(m.group(1)) if m else None
          algorithm={'schema':'ITEM3_SWEEP_V9_ALGORITHM_PERFORMANCE_REPETITION_V2','repetition':rep,'runner_terminal_class':runner.get('terminal_class'),'attempt_count':len(attempts),'accepted_leaf_count':len(leaves),'r_split_count':rs,'lambda_split_count':ls,'max_r_depth':maxr,'max_lambda_depth':maxl,'runner_kernel_calls':runner.get('kernel_call_counts'),'checker_control_kernel_calls':checker.get('control_kernel_call_counts'),'checker_verify_kernel_calls':checker.get('verify_kernel_call_counts'),'runner_wall_seconds':timing.get('runner_wall_seconds'),'checker_wall_seconds':timing.get('checker_wall_seconds'),'complete_path_wall_seconds':wall,'peak_memory_kib':peak}
          cp={'schema':'ITEM3_SWEEP_V9_CHECKPOINT_OVERHEAD_REPETITION_V2','repetition':rep,'checkpoint_wall_seconds':cpsec,'complete_path_wall_seconds':wall,'checkpoint_overhead_fraction':overhead,'recovered_commit_count':len(recovered),'record_chain_match':chain_ok,'last_checkpoint_sha256':last_sha,'status':'PASSED' if overhead_gate and chain_ok else 'FAILED'}
          report={'schema':'ITEM3_SWEEP_V9_PERFORMANCE_REPETITION_V2','repetition':rep,'authorization':'QUALIFICATION_ONLY','driver_exit_code':rc,'complete_path_wall_seconds':wall,'hard_time_gate':hard,'mathematical_completion':mathematical,'stop_floor_incomplete_count':0 if no_stop else 1,'partition_replay_dps50':fresh,'accepted_cell_verification_dps70':fresh,'record_chain_match':chain_ok,'final_partition_match':fresh,'checkpoint_overhead_fraction':overhead,'checkpoint_overhead_gate':overhead_gate,'artifact_prepared':artifact,'counted_success':counted,'status':'COUNTED_PASS' if counted else 'FAILED','tag_created':False,'certified_lambda_range':False}
          for name,obj in [('ALGORITHM_PERFORMANCE.json',algorithm),('CHECKPOINT_OVERHEAD.json',cp),('REPETITION_REPORT.json',report)]: (root/name).write_text(json.dumps(obj,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Run hosted component timing samples
        env:
          REPETITION: ${{ matrix.repetition }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os,sys,time
          from fractions import Fraction
          from pathlib import Path
          from flint import arb,ctx
          rep=int(os.environ['REPETITION']); root=Path(f'perf-v2-rep-{rep}'); base=Path(os.environ['BASE']); kpath=base/'prolate_F_derivatives_cleanroom_v9_candidate.py'; apath=base/'adapter_v9_candidate_v2.py'
          def load(name,path): spec=importlib.util.spec_from_file_location(name,path); mod=importlib.util.module_from_spec(spec); sys.modules[name]=mod; spec.loader.exec_module(mod); return mod
          kernel=load(f'perf_v2_kernel_{rep}',kpath); adapter_mod=load(f'perf_v2_adapter_{rep}',apath); ctx.dps=50
          lam_lo=arb(123731943)/arb(26214400); lam_hi=arb(118)/arb(25)
          classes={'point_center':(arb('0.03'),arb('4.72')),'narrow_box':(arb('0.02999').union(arb('0.03001')),lam_lo.union(lam_hi))}
          rows=[]
          for cls,(r,lmb) in classes.items():
              for op in ['F_arb','F_r_arb','F_lambda_arb','F_rr_arb','F_rlambda_arb']:
                  fn=getattr(kernel,op)
                  for sample in range(1,4):
                      t0=time.perf_counter(); err=None
                      try: value=fn(r,lmb,tol='1e-8',depth=12,limit=200000)
                      except Exception as exc: value=None; err=f'{type(exc).__name__}:{exc}'
                      sec=time.perf_counter()-t0; finite=bool(value is not None and value.is_finite()); radius=str((value.upper()-value.lower())/2) if finite else None
                      rows.append({'schema':'ITEM3_SWEEP_V9_KERNEL_MICROBENCHMARK_ROW_V2','repetition':rep,'input_class':cls,'operation':op,'sample':sample,'seconds':sec,'finite':finite,'radius':radius,'error':err})
          with (root/'KERNEL_MICROBENCHMARK.jsonl').open('w',encoding='utf-8',newline='\n') as f:
              for row in rows: f.write(json.dumps(row,sort_keys=True,separators=(',',':'))+'\n')
          cfg=json.loads(Path(os.environ['CONFIG']).read_text()); ad=adapter_mod.V9MeanValueAdapter(checkout_root=Path.cwd(),kernel_source_path=str(kpath),kernel_source_sha256=cfg['source_sha256']['kernel'],tol='1e-8',integration_depth=12,integration_limit=200000,module_name=f'perf_v2_mv_{rep}')
          lbox=(Fraction(123731943,26214400),Fraction(118,25)); rcells=[(Fraction(1,64),Fraction(1,64)+Fraction(1,1<<14)),(Fraction(3,100)-Fraction(1,1<<15),Fraction(3,100)+Fraction(1,1<<15)),(Fraction(11,256)-Fraction(1,1<<14),Fraction(11,256))]
          def rat(x): return {'p':str(x.numerator),'q':str(x.denominator)}
          def rad(iv): return None if not iv.finite else rat((iv.hi-iv.lo)/2)
          mv=[]
          for i,cell in enumerate(rcells,1):
              ev=ad.evaluate_mean_value(r_cell=cell,lambda_box=lbox,dps=50); raw=ad.evaluate_g(r_cell=cell,lambda_box=lbox,dps=50)
              mv.append({'schema':'ITEM3_SWEEP_V9_MEAN_VALUE_COMPONENT_ROW_V2','repetition':rep,'sample':i,'r_cell':[rat(cell[0]),rat(cell[1])],'lambda_box':[rat(lbox[0]),rat(lbox[1])],'g_r_center_radius':rad(ev.g_r_center.final),'r_correction_radius':rad(ev.r_correction),'lambda_correction_radius':rad(ev.lambda_correction),'mean_value_radius':rad(ev.mean_value),'mean_value_hi':rat(ev.mean_value.hi) if ev.mean_value.finite else None,'raw_g_radius':rad(raw)})
          with (root/'MEAN_VALUE_COMPONENTS.jsonl').open('w',encoding='utf-8',newline='\n') as f:
              for row in mv: f.write(json.dumps(row,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Upload repetition evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: item3-v9-performance-v2-rep-${{ matrix.repetition }}
          path: perf-v2-rep-${{ matrix.repetition }}
          if-no-files-found: error
          retention-days: 30
      - name: Repetition final gate
        env:
          REPETITION: ${{ matrix.repetition }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path(f"perf-v2-rep-{os.environ['REPETITION']}/REPETITION_REPORT.json").read_text()); raise SystemExit(0 if r['status']=='COUNTED_PASS' else 1)
          PY

  cancellation:
    name: controlled cancellation recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
      - run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Interrupt qualification path after durable checkpoints exist
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cancellation-v2/output
          set +e
          timeout --signal=TERM 180s python "$BASE/rehearsal_driver_v9_candidate_v3.py" --checkout-root . --config "$CONFIG" --output-dir cancellation-v2/output --qualification-mode > cancellation-v2/DRIVER_STDOUT.log 2> cancellation-v2/DRIVER_STDERR.log
          rc=$?
          set -e
          printf '%s\n' "$rc" > cancellation-v2/TIMEOUT_EXIT_CODE.txt
          printf '{"truncated":' > cancellation-v2/output/checkpoint/.truncated-temp-for-recovery-test || true
      - name: Verify cancellation recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          root=Path('cancellation-v2/output/checkpoint'); src=Path('CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/checkpoint_v9_candidate.py')
          spec=importlib.util.spec_from_file_location('cancel_v2_checkpoint',src); mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          rc=int(Path('cancellation-v2/TIMEOUT_EXIT_CODE.txt').read_text()); records=mod.recover_committed(root); last=records[-1] if records else None; partial={}
          if last: partial=json.loads((root/'checkpoint_payloads'/'partial'/f'{last.partial_evidence_sha256}.json').read_text())
          forbidden={'verdict','terminal_class','certified_lambda_range','certificate'}; no_verdict=partial.get('status')=='PARTIAL' and not(forbidden&set(partial)); temp=(root/'.truncated-temp-for-recovery-test').exists()
          status='PASSED' if rc in {124,143} and bool(records) and no_verdict and temp else 'FAILED'
          report={'schema':'ITEM3_SWEEP_V9_CANCELLATION_RECOVERY_V2','status':status,'timeout_exit_code':rc,'recovered_checkpoint_count':len(records),'last_checkpoint_sha256':last.checkpoint_sha256 if last else None,'partial_status':partial.get('status'),'partial_contains_verdict':not no_verdict,'truncated_temp_ignored':temp,'tag_created':False,'certified_lambda_range':False}
          Path('cancellation-v2/CANCELLATION_RECOVERY.json').write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n'); print(json.dumps(report,indent=2,sort_keys=True)); raise SystemExit(0 if status=='PASSED' else 1)
          PY
      - name: Upload cancellation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: item3-v9-cancellation-recovery-v2
          path: cancellation-v2
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: aggregate performance qualification v2
    if: always()
    needs: [full_path, cancellation]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download repetition 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: item3-v9-performance-v2-rep-1
          path: downloaded-v2/rep-1
      - name: Download repetition 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: item3-v9-performance-v2-rep-2
          path: downloaded-v2/rep-2
      - name: Download repetition 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: item3-v9-performance-v2-rep-3
          path: downloaded-v2/rep-3
      - name: Download cancellation recovery
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: item3-v9-cancellation-recovery-v2
          path: downloaded-v2/cancellation
      - name: Build canonical performance package v2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,math,statistics
          from collections import defaultdict
