name: Fix item 6 pole modulus byte identity

on:
  push:
    branches:
      - agent/prolate-item6-axis
    paths:
      - .github/workflows/fix-item6-pole-modulus-byte-identity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prolate-item6-axis
          fetch-depth: 0
      - name: Restore exact artifact bytes
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path("CERTIFICATES/prolate/item6_axis/prolate_axis_pole_modulus_split.json")
          current = path.read_bytes()
          current_hash = sha256(current).hexdigest()
          artifact_hash = "82ea7a0281582c66bcc725023feb9d9246e7655474199125fce9364885c81348"
          newline_hash = "f1b5c004f6e16805ec6fc60b657e8f210cd27749a8936de8c47197dffa621455"

          if current_hash == artifact_hash:
              print("Already byte-identical to the Actions artifact.")
          else:
              assert current_hash == newline_hash, current_hash
              assert current.endswith(b"\n")
              repaired = current[:-1]
              assert sha256(repaired).hexdigest() == artifact_hash
              path.write_bytes(repaired)
              print("Removed the single archive-added trailing newline.")
          PY
          rm .github/workflows/fix-item6-pole-modulus-byte-identity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CERTIFICATES/prolate/item6_axis/prolate_axis_pole_modulus_split.json \
                  .github/workflows/fix-item6-pole-modulus-byte-identity.yml
          git diff --cached --check
          git commit -m "Restore exact pole modulus artifact bytes"
          git push origin HEAD:agent/prolate-item6-axis
