name: Item 3 v9 256-leaf validation v2 run3

on:
  push:
    branches:
      - agent/item3-v9-analytic-proof
    paths:
      - ".github/workflows/item3-v9-256-leaf-validation-v2.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
      - name: Install pinned validated arithmetic
        run: python -m pip install python-flint==0.9.0

      - name: Verify prepublication and exact input identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from collections import Counter
          from pathlib import Path
          base=Path('CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate')
          corpus=base/'validation_corpus_v2'; expect=corpus/'CONTROL_EXPECT.json'; obj=json.loads(expect.read_text())
          assert obj['schema']=='ITEM3_SWEEP_V9_CONTROL_EXPECT_V2' and obj['status']=='PREPUBLISHED_EXPECTATIONS'
          assert obj['leaf_count']==256 and len(obj['leaves'])==256
          assert dict(Counter(x['category'] for x in obj['leaves']))==obj['category_floors']=={'A':32,'B':32,'C':80,'D':32,'E':32,'F':24,'G':16,'H':8}
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          if sha(corpus/'run_validation_corpus_v2.py')!=obj['validation_source_sha256']: raise SystemExit('validator drift after prepublication')
          if sha(corpus/'independent_reference_v2.py')!=obj['independent_reference_sha256']: raise SystemExit('independent reference drift after prepublication')
          print('PREPUBLISHED_EXPECTATIONS=LOCKED')
          PY

      - name: Execute counted 256-leaf corpus
        id: corpus
        shell: bash
        run: |
          set +e
          python CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_corpus_v2/run_validation_corpus_v2.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record counted validation environment
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,platform
          from pathlib import Path
          import flint
          corpus=Path('CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_corpus_v2')
          wf=Path('.github/workflows/item3-v9-256-leaf-validation-v2.yml')
          obj={
            'schema':'ITEM3_SWEEP_V9_VALIDATION_ENVIRONMENT_V2','authorization':'VALIDATION_ONLY',
            'python':platform.python_version(),'python_flint':getattr(flint,'__version__','UNKNOWN'),
            'flint_library':getattr(flint,'__FLINT_VERSION__','UNKNOWN'),'platform':platform.platform(),
            'workflow_sha256':hashlib.sha256(wf.read_bytes()).hexdigest(),'github_sha':'${{ github.sha }}',
            'freeze_authorized':False,'production_rehearsal_authorized':False,'tag_created':False,'certified_lambda_range':False,
          }
          (corpus/'VALIDATION_ENVIRONMENT.json').write_text(json.dumps(obj,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(obj,sort_keys=True))
          PY

      - name: Commit counted outcome immutably
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DIR="CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_corpus_v2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DIR/CONTROL_MATRIX.json" "$DIR/VALIDATION_REPORT.json" "$DIR/VALIDATION_ENVIRONMENT.json"
          git diff --cached --check
          git commit -m "Record item3 v9 validation corpus v2 run3 outcome"
          git push origin HEAD:agent/item3-v9-analytic-proof

      - name: Enforce counted verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.corpus.outputs.rc }}" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_corpus_v2/VALIDATION_REPORT.json')
          obj=json.loads(p.read_text())
          if obj.get('status')!='PASSED' or obj.get('leaf_count')!=256 or obj.get('failure_count')!=0:
              raise SystemExit('counted validation did not pass all 256 leaves')
          if obj.get('freeze_authorized') or obj.get('production_rehearsal_authorized') or obj.get('tag_created') or obj.get('certified_lambda_range'):
              raise SystemExit('validation report contains forbidden promotion flag')
          print('COUNTED_VALIDATION_V2_RUN3=PASSED')
          PY
