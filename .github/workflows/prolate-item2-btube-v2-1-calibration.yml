name: Prolate item 2 B-TUBE v2.1 calibration only

on:
  push:
    tags:
      - "btube-v2-1-calibration-approved-*"

permissions:
  contents: read

concurrency:
  group: btube-v2-1-calibration-${{ github.sha }}
  cancel-in-progress: false

jobs:
  calibration:
    if: startsWith(github.ref_name, 'btube-v2-1-calibration-approved-')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CALIBRATION_CONFIG_SHA256: 47d8b88e57298b0434c5ee2912879a088fd508b6da376f2bdce0da70b0532852
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Verify approved tag names the exact run head
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#btube-v2-1-calibration-approved-}"
          test "${expected}" = "${GITHUB_SHA}"
          test "${#expected}" -eq 40

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify checkout and fresh workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          test ! -e btube-calibration-run
          test ! -e btube-calibration-delivery

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Enforce B-LOCAL binding gate before any result-bearing step
        working-directory: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum config.calibration.json | awk '{print $1}')" = "${CALIBRATION_CONFIG_SHA256}"
          test "$(wc -c < config.calibration.json)" -eq 2196
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("config.calibration.json").read_text(encoding="utf-8"))
          expected_machine = {
              "all_F_Fr_consumers_finite_routes": True,
              "all_required_consumers_authorized_routes": True,
              "l3_boundary_monotonicity_route": True,
              "lambda_start": {"p": "3307749", "q": "1600000"},
              "schema": "btube-blocal-machine-conclusion-v2-finite-routes",
              "selected_candidate_index": 0,
              "start_root_interval": {
                  "hi": {"e": 0, "m": "1"},
                  "lo": {"e": 11, "m": "2047"},
              },
              "status": "BLOCAL_COMPLETE",
              "u_max": {"e": 8, "m": "1"},
          }
          expected_dependency = {
              "artifact_zip_sha256": "7c1748148470426648dd03a483a076b043ed70558258358834671451267e64dc",
              "certificate_sha256": "b8d27c01d63f3ea53bfeb165f7e140d739fab6b3949115e0aac3fd64b2d05cb6",
              "config_sha256": "dab371fa62ed10a00029cd31b0002e503952277ef072fb8f5d7fd5222965d469",
              "lambda_start": {"p": "3307749", "q": "1600000"},
              "machine_conclusion": expected_machine,
              "source_head": "a8997d11850dbd5b63e3064560a1c311e5c9c267",
              "status": "PINNED",
          }
          if (
              config.get("mode") != "BINDING"
              or config.get("binding_to_final_lambda_start") is not True
              or config.get("blocal_dependency") != expected_dependency
          ):
              raise SystemExit(
                  "B-LOCAL/B-ENTRY unpinned: workflow binding run prohibited"
              )
          PY

      - name: Install hash-locked calibration dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r CERTIFICATES/prolate/item2_circle/b_tube_v2_1/requirements-calibration.txt

      - name: Compile and run static controls
        working-directory: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/btube-pycache
        run: |
          set -euo pipefail
          find . -name '*.py' -print0 | sort -z | xargs -0 python -m py_compile
          python -m unittest discover -s tests -v
          python calibration.py verify-config

      - name: Run calibration-only candidate evaluation
        working-directory: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
        shell: bash
        run: |
          set -euo pipefail
          python calibration.py run --out "${GITHUB_WORKSPACE}/btube-calibration-run"

      - name: Independent canonical and chain verification
        working-directory: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
        shell: bash
        run: |
          set -euo pipefail
          python calibration.py verify \
            --phase pre \
            --source-head "${GITHUB_SHA}" \
            --out "${GITHUB_WORKSPACE}/btube-calibration-run"

      - name: Independent full record-layout verification
        working-directory: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_calibration.py verify-output \
            --source-head "${GITHUB_SHA}" \
            --out "${GITHUB_WORKSPACE}/btube-calibration-run"

      - name: Assemble byte-closed delivery
        working-directory: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
        shell: bash
        run: |
          set -euo pipefail
          python calibration.py deliver \
            --source-head "${GITHUB_SHA}" \
            --out "${GITHUB_WORKSPACE}/btube-calibration-run" \
            --delivery "${GITHUB_WORKSPACE}/btube-calibration-delivery"

      - name: Independent final receipt verification
        working-directory: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
        shell: bash
        run: |
          set -euo pipefail
          python calibration.py verify \
            --phase final \
            --source-head "${GITHUB_SHA}" \
            --archive "${GITHUB_WORKSPACE}/btube-calibration-delivery/btube-v2-1-calibration.zip" \
            --receipt "${GITHUB_WORKSPACE}/btube-calibration-delivery/DELIVERY_RECEIPT.json"
          LEFTOVER="$(git status --porcelain \
            | grep -vE '^\?\? btube-calibration-(run|delivery)/$' || true)"
          test -z "$LEFTOVER"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: btube-v2-1-calibration-${{ github.sha }}
          path: |
            btube-calibration-delivery/btube-v2-1-calibration.zip
            btube-calibration-delivery/DELIVERY_RECEIPT.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload calibration diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: btube-v2-1-calibration-${{ github.sha }}-diagnostics
          path: |
            btube-calibration-run
            btube-calibration-delivery
          if-no-files-found: warn
          retention-days: 14
