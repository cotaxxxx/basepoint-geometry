name: Prolate item 3 C-G-TUBE pilot (clean-room)
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CG_TUBE_REPO_ROOT: ${{ github.workspace }}
jobs:
  cgtube-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: CERTIFICATES/prolate/item3_center_connection/c_g_tube
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install python-flint==0.9.0
      - name: Clean-room preflight (no pre-existing artifacts)
        run: |
          set -e
          for f in endpoints_chain.jsonl cells_chain.jsonl spots_chain.jsonl \
                   C_G_ENDPOINT_SIGNS.json C_G_TUBE_PILOT.json \
                   C_G_IDENTITY_CROSSCHECK.json CONTROLS.json \
                   DEPENDENCIES.json SHA256SUMS.txt; do
            if [ -e "$f" ]; then echo "PRE-EXISTING ARTIFACT: $f"; exit 2; fi
          done
      - name: Provenance header
        run: |
          echo "source_head=$(git rev-parse HEAD)"
          echo "config_sha256=$(sha256sum config.json | cut -d' ' -f1)"
          sha256sum "$CG_TUBE_REPO_ROOT"/CERTIFICATES/prolate/item2_circle/vendor/prolate_circle_F_cleanroom.py \
                    "$CG_TUBE_REPO_ROOT"/CERTIFICATES/prolate/item3_center_connection/vendor/prolate_circle_Frr_ext.py
      - name: "Calibration pin verification (PR #15 schema-v2)"
        run: |
          python3 - << 'PY'
          import hashlib, json, os, sys
          cfg = json.load(open("config.json"))
          cal = cfg["calibration"]
          p = os.path.join(os.environ["CG_TUBE_REPO_ROOT"], cal["path"])
          got = hashlib.sha256(open(p, "rb").read()).hexdigest()
          sys.exit(0 if got == cal["sha256"] else 2)
          PY
      - name: Endpoint signs
        run: python3 c_g_tube_pilot.py --phase endpoints
      - name: 56 Taylor cells
        run: python3 c_g_tube_pilot.py --phase cells
      - name: Identity spots [0, 18, 37, 55]
        run: python3 c_g_tube_pilot.py --phase spots
      - name: Negative controls (checker fail-closed)
        run: python3 run_controls.py
      - name: Checker + eight-condition finalize
        run: python3 c_g_tube_checker.py
      - name: Manifest
        run: |
          python3 gen_manifest.py
          sha256sum SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: art
        with:
          name: item3-cgtube-pilot-${{ github.run_id }}
          path: CERTIFICATES/prolate/item3_center_connection/c_g_tube
      - name: Artifact digest
        working-directory: .
        run: echo "artifact_digest=${{ steps.art.outputs.artifact-digest }}"
