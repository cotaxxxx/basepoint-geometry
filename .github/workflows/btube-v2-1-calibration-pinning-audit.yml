name: B-TUBE v2.1 calibration pinning audit

on:
  push:
    branches:
      - "agent/btube-v2-1-calibration-pinned"

permissions:
  contents: read

concurrency:
  group: btube-v2-1-calibration-pinning-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install hash-locked calibration dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r CERTIFICATES/prolate/item2_circle/b_tube_v2_1/requirements-calibration.txt

      - name: Compile, unit-test, and verify binding config
        working-directory: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.py' -print0 | sort -z | xargs -0 python -m py_compile
          python -m unittest discover -s tests -v
          python calibration.py verify-config
