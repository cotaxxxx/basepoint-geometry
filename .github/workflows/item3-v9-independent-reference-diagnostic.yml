name: Item 3 v9 independent reference diagnostic

on:
  push:
    branches:
      - agent/item3-v9-analytic-proof
    paths:
      - ".github/workflows/item3-v9-independent-reference-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/item3-v9-analytic-proof
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
      - run: python -m pip install python-flint==0.9.0
      - name: Compare independent route against validated candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.util, json, sys
          from pathlib import Path
          from flint import arb
          base=Path('CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate')
          ref_path=base/'validation_corpus_v2/independent_reference_v2.py'
          ker_path=base/'prolate_F_derivatives_cleanroom_v9_candidate.py'
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path); mod=importlib.util.module_from_spec(spec); sys.modules[name]=mod; spec.loader.exec_module(mod); return mod
          ref=load('v9_independent_ref_diag',ref_path); ker=load('v9_candidate_diag',ker_path)
          rows=[]
          funcs=[('F',ref.F_reference,ker.F_arb),('F_r',ref.F_r_reference,ker.F_r_arb),('F_rr',ref.F_rr_reference,ker.F_rr_arb)]
          for point_index,(r,lmb) in enumerate(ref.REFERENCE_POINTS,1):
              for name,rfn,kfn in funcs:
                  rv=float(rfn(r,lmb))
                  kv=kfn(arb(str(r)),arb(str(lmb)),tol='1e-8',depth=12,limit=200000)
                  klo=float(kv.lower()); khi=float(kv.upper()); kmid=(klo+khi)/2.0
                  rows.append({'point_index':point_index,'operation':name,'r':r,'lambda':lmb,'reference':rv,'candidate_lo':klo,'candidate_hi':khi,'candidate_mid':kmid,'abs_error':abs(kmid-rv),'candidate_radius':(khi-klo)/2.0})
          maxima={name:max(x['abs_error'] for x in rows if x['operation']==name) for name in ('F','F_r','F_rr')}
          report={'schema':'ITEM3_SWEEP_V9_INDEPENDENT_REFERENCE_DIAGNOSTIC_V1','status':'DIAGNOSTIC_ONLY','reference_source_sha256':hashlib.sha256(ref_path.read_bytes()).hexdigest(),'kernel_source_sha256':hashlib.sha256(ker_path.read_bytes()).hexdigest(),'max_abs_error':maxima,'rows':rows,'freeze_authorized':False,'tag_created':False,'certified_lambda_range':False}
          out=base/'validation_corpus_v2/INDEPENDENT_REFERENCE_DIAGNOSTIC.json'
          out.write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_corpus_v2/INDEPENDENT_REFERENCE_DIAGNOSTIC.json
          git diff --cached --check
          git commit -m "Record item3 v9 independent reference diagnostic"
          git push origin HEAD:agent/item3-v9-analytic-proof
