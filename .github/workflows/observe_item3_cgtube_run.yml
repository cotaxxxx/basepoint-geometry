name: Observe item3 C-G-TUBE certification run

on:
  workflow_run:
    workflows: ["Prolate item 3 C-G-TUBE pilot (clean-room)"]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: observe-item3-cgtube-receipt
  cancel-in-progress: false

env:
  EXPECTED_SOURCE_HEAD: 1e0f671c91798b9c044c04c7a4224a21e1e67830
  EXPECTED_CONFIG_SHA256: bb6a3655d335240549cbe1f6eec2a9e68e00219eb9c1a2be65796e2e342a0d17
  EXCLUDED_HEAD_SHA: 87c68a1f4403166daa091e3c24f7f007102a5615

jobs:
  record:
    if: github.event.workflow_run.head_sha != '87c68a1f4403166daa091e3c24f7f007102a5615'
    runs-on: ubuntu-latest
    steps:
      - name: Record canonical run receipt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ACTION: ${{ github.event.action }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = int(os.environ["RUN_ID"])
          path = ".github/run-receipts/item3-cgtube-canonical-latest.json"
          api = f"https://api.github.com/repos/{repo}/contents/{path}"
          headers = {
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "item3-cgtube-canonical-observer",
          }

          artifacts = []
          if os.environ["RUN_STATUS"] == "completed":
              artifacts_api = (
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts"
                  "?per_page=100"
              )
              req = urllib.request.Request(artifacts_api, headers=headers)
              with urllib.request.urlopen(req) as response:
                  artifact_data = json.load(response)
              artifacts = [
                  {
                      "id": item["id"],
                      "name": item["name"],
                      "digest": item.get("digest"),
                      "size_in_bytes": item.get("size_in_bytes"),
                      "expired": item.get("expired"),
                  }
                  for item in artifact_data.get("artifacts", [])
              ]

          receipt = {
              "schema": "item3-cgtube-canonical-run-receipt-v1",
              "workflow": "workflow_item3_cgtube_pilot.yml",
              "observer_event": os.environ["EVENT_ACTION"],
              "status": os.environ["RUN_STATUS"],
              "conclusion": os.environ["RUN_CONCLUSION"] or None,
              "run_id": run_id,
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "run_url": os.environ["RUN_URL"],
              "trigger_sha": os.environ["TRIGGER_SHA"],
              "trigger_branch": os.environ["TRIGGER_BRANCH"],
              "source_head": os.environ["EXPECTED_SOURCE_HEAD"],
              "config_sha256": os.environ["EXPECTED_CONFIG_SHA256"],
              "artifacts": artifacts,
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }

          existing_sha = None
          existing_receipt = None
          try:
              req = urllib.request.Request(api + "?ref=main", headers=headers)
              with urllib.request.urlopen(req) as response:
                  existing = json.load(response)
              existing_sha = existing["sha"]
              existing_receipt = json.loads(
                  base64.b64decode(existing["content"]).decode()
              )
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          rank = {"requested": 0, "in_progress": 1, "completed": 2}
          if existing_receipt is not None:
              old_id = int(existing_receipt.get("run_id", 0))
              old_rank = rank.get(existing_receipt.get("status"), -1)
              new_rank = rank.get(receipt["status"], -1)
              if run_id < old_id or (run_id == old_id and new_rank < old_rank):
                  raise SystemExit(0)

          body = {
              "message": f"Record canonical item3 C-G-TUBE run {run_id} {receipt['status']}",
              "content": base64.b64encode(
                  (json.dumps(receipt, indent=2, sort_keys=True) + "\n").encode()
              ).decode(),
              "branch": "main",
          }
          if existing_sha is not None:
              body["sha"] = existing_sha
          req = urllib.request.Request(
              api,
              data=json.dumps(body).encode(),
              headers={**headers, "Content-Type": "application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(req) as response:
              json.load(response)
          PY
