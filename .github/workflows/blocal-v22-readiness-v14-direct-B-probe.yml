name: B-LOCAL v2.2 readiness v15.1 dominant-child diagnostic
on:
  push:
    branches: ["agent/blocal-v22-readiness-draft"]
    paths: [".github/workflows/blocal-v22-readiness-v14-direct-B-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    if: github.ref_name == 'agent/blocal-v22-readiness-draft'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    env:
      BLOCAL_DIR: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
      EPHEMERAL_CONFIG: CERTIFICATES/prolate/item2_circle/b_tube_v2_1/config.blocal-v2.2-readiness-ephemeral.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/blocal-v22-readiness-draft
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Guard
        run: |
          set -euo pipefail
          grep -qx 'config_materialized=false' "$BLOCAL_DIR/READINESS_DRAFT"
          grep -qx 'production_authorized=false' "$BLOCAL_DIR/READINESS_DRAFT"
          grep -qx 'tag_authorized=false' "$BLOCAL_DIR/READINESS_DRAFT"
      - name: Install Arb
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Ephemeral config
        run: |
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          h=Path("CERTIFICATES/prolate/item2_circle/b_tube_v2_1");sys.path.insert(0,str(h.resolve()))
          import blocal_v22_checker_test as ct, blocal_v22_model as m
          old=json.loads((h/"config.blocal-v2.2-run.json").read_text());c=ct.config()
          for k in ("stage1_dependency","kernel","adapter","base_v21","outputs"):c[k]=old[k]
          ns=["blocal_v22_policy.py","blocal_v22_model.py","blocal_v22_boundary.py","blocal_v22_checker.py","blocal_v22_checker_test.py","blocal_v22_runner.py","blocal_v22_static_test.py","blocal_v22_symbolic_audit.py","blocal_v22_readiness_test.py"];p="CERTIFICATES/prolate/item2_circle/b_tube_v2_1/";hs={p+n:hashlib.sha256((h/n).read_bytes()).hexdigest() for n in ns}
          c["implementation"]={"entrypoint_path":p+"blocal_v22_runner.py","sources_sha256":hs};c["checker"]={"id":m.CHECKER_ID,"path":p+"blocal_v22_checker.py","source_sha256":hs[p+"blocal_v22_checker.py"]};c["symbolic_audit"]={"id":m.SYMBOLIC_AUDIT_ID,"path":p+"blocal_v22_symbolic_audit.py","source_sha256":hs[p+"blocal_v22_symbolic_audit.py"]};m.validate_config(c);(h/"config.blocal-v2.2-readiness-ephemeral.json").write_bytes(m.canonical_json_bytes(c))
          PY
      - name: Static
        working-directory: CERTIFICATES/prolate/item2_circle/b_tube_v2_1
        run: python blocal_v22_static_test.py
      - name: Apply exact R1 sectors and dominant-child instrumentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("CERTIFICATES/prolate/item2_circle/b_tube_v2_1/diagnostics/blocal_v22_direct_B_probe_v14.py")
          s=p.read_text()
          s=s.replace('if p1<=HALF_PI_HI:','if cell.b1<=Fraction(1,2):',1)
          s=s.replace('if p0>=HALF_PI_HI:','if cell.b0>=Fraction(1,2):',1)
          s=s.replace('if p1<=HALF_PI_HI:','if (cell.region=="R1" and cell.b1<=Fraction(1,2)) or (cell.region=="R2" and p1<=HALF_PI_HI):',1)
          needle='''  c0,c1,p0,p1=src(cell,eps_split)\n  if cell.region=="R2" and c0==0 and Fraction(1)-p1*p1/Fraction(6)<=0 and p0<HALF_PI_HI:return B\n'''
          repl='''  c0,c1,p0,p1=src(cell,eps_split)\n  if cell.region=="R1" and cell.b0<Fraction(1,2)<cell.b1:return B\n  if cell.region=="R2" and c0==0 and Fraction(1)-p1*p1/Fraction(6)<=0 and p0<HALF_PI_HI:return B\n'''
          assert needle in s;s=s.replace(needle,repl)
          old='''  val=-g["U"]*h-hp*M*gamma*z*z\n  out=val*measure*ex((cell.a1-cell.a0)*(cell.b1-cell.b0));can(out,"out")\n  return out,{"v14":True,"D_floor":model.rational_json(Dlo),"floor_source":fd["floor_source"],"gamma_fallback_used":bool(gs)}\n'''
          new='''  term1=-g["U"]*h;term2=-hp*M*gamma*z*z;val=term1+term2\n  out=val*measure*ex((cell.a1-cell.a0)*(cell.b1-cell.b0));can(out,"out")\n  if cell.path=="R1000000010000":\n   def jj(ball,name):\n    a0,a1=model.interval_fractions(can(ball,"DOM."+name),"DOM."+name);return {"lo":model.rational_json(a0),"hi":model.rational_json(a1),"width":model.rational_json(a1-a0)}\n   print(json.dumps({"DOMINANT_CHILD":True,"path":cell.path,"box":{"a0":model.rational_json(cell.a0),"a1":model.rational_json(cell.a1),"b0":model.rational_json(cell.b0),"b1":model.rational_json(cell.b1)},"source":{"c0":model.rational_json(c0),"c1":model.rational_json(c1),"p0":model.rational_json(p0),"p1":model.rational_json(p1)},"D_floor":model.rational_json(Dlo),"D_hi":model.rational_json(Dhi),"floor_source":fd["floor_source"],"U":jj(g["U"],"U"),"Ahat":jj(A,"Ahat"),"Bhat":jj(B,"Bhat"),"M":jj(M,"M"),"z":jj(z,"z"),"y":jj(y,"y"),"gamma":jj(gamma,"gamma"),"h":jj(h,"h"),"h1":jj(hp,"h1"),"term1":jj(term1,"term1"),"term2":jj(term2,"term2"),"value":jj(val,"value"),"contribution":jj(out,"contribution"),"gamma_fallback":bool(gs)},sort_keys=True,separators=(",",":")),flush=True)\n  return out,{"v14":True,"D_floor":model.rational_json(Dlo),"floor_source":fd["floor_source"],"gamma_fallback_used":bool(gs)}\n'''
          assert old in s;s=s.replace(old,new)
          # Only initial phase is needed for the decomposition.
          start='tests=[("initial",1-um,1-um,lam,lam,"POS"),("l2",1-um,1-um,model.LAMBDA_PLUS-model.S_NEG,lam,"POS"),("l3",Fraction(1),Fraction(1),model.LAMBDA_PLUS,lam,"NEG")]'
          assert start in s;s=s.replace(start,'tests=[("initial",1-um,1-um,lam,lam,"POS")]')
          p.write_text(s)
          PY
      - name: Dominant-child diagnostic
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 1200s python "$BLOCAL_DIR/diagnostics/blocal_v22_direct_B_probe_v14.py" | tee /tmp/v151.json
      - name: Cleanup
        if: always()
        run: |
          rm -f "$EPHEMERAL_CONFIG"
          git checkout -- "$BLOCAL_DIR/diagnostics/blocal_v22_direct_B_probe_v14.py"
          test "$(git diff --name-only -- "$BLOCAL_DIR/config.blocal-v2.2-run.json")" = ""
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE: ${{ steps.probe.outcome }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          body=json.dumps({"state":"failure" if os.environ["PROBE"]!="success" else "success","context":"blocal-v22-readiness-v15.1-dominant-child","description":"dominant_child="+os.environ["PROBE"],"target_url":f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode();req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=body,method="POST",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","Content-Type":"application/json"});print(urllib.request.urlopen(req).read().decode())
          PY
      - name: Diagnostic complete
        if: always()
        run: echo "inspect dominant child decomposition"
