name: Item 3 v9 validation v2 run1 harness repair

on:
  push:
    branches:
      - agent/item3-v9-analytic-proof
    paths:
      - ".github/workflows/item3-v9-validation-v2-run1-harness-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/item3-v9-analytic-proof
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
      - run: python -m pip install python-flint==0.9.0
      - name: Repair only the eight run1 harness defects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_corpus_v2/run_validation_corpus_v2.py')
          t=p.read_text(encoding='utf-8')
          replacements=[
            ("'gamma_r = B * N / (q * sqrt_q)','gamma_r = -B * N / q32'", "'gamma_r = B * N / (q * sqrt_q)','gamma_r = -B * N / (q * sqrt_q)'"),
            ("('return _evaluate(_F_rr_kernel, r, lam','return _evaluate(_F_r_kernel, r, lam',\"F_rr\")", "('h3 * g[\"gamma_r\"] ** 3','2 * h3 * g[\"gamma_r\"] ** 3',\"F_rr\")"),
            ('return observed_pass(checkpoint.recover_committed(root)==[],"cancel after first payload publication")', 'return observed_pass(checkpoint.recover_committed(root,allow_missing_ledger=True)==[],"cancel after first payload publication")'),
            ('return observed_pass(checkpoint.recover_committed(root)==[],"cancel after both payloads before ledger")', 'return observed_pass(checkpoint.recover_committed(root,allow_missing_ledger=True)==[],"cancel after both payloads before ledger")'),
          ]
          for old,new in replacements:
              if t.count(old)!=1: raise SystemExit(f'anchor count={t.count(old)}: {old}')
              t=t.replace(old,new,1)
          old='''            if kind=="mid": rejected=mod.canonical_midpoint((Fraction(1,4),Fraction(3,4)))!=Fraction(1,2)\n            elif kind=="gr": rejected=mod._quotient_gr(arb(1),arb(2),arb(4)).final!=adapter._quotient_gr(arb(1),arb(2),arb(4)).final\n            elif kind=="grr": rejected=mod._quotient_grr(arb(1),arb(2),arb(3),arb(4)).final!=adapter._quotient_grr(arb(1),arb(2),arb(3),arb(4)).final\n            elif kind=="grl": rejected=mod._quotient_grlambda(arb(1),arb(2),arb(4)).final!=adapter._quotient_grlambda(arb(1),arb(2),arb(4)).final\n            else: rejected=sha256_file(p)!=TARGET["source_sha256"]["adapter"]\n'''
          new='''            try:\n                if kind=="mid": rejected=mod.canonical_midpoint((Fraction(1,4),Fraction(3,4)))!=Fraction(1,2)\n                elif kind=="gr": rejected=mod._quotient_gr(arb(1),arb(2),arb(4)).final!=adapter._quotient_gr(arb(1),arb(2),arb(4)).final\n                elif kind=="grr": rejected=mod._quotient_grr(arb(1),arb(2),arb(3),arb(4)).final!=adapter._quotient_grr(arb(1),arb(2),arb(3),arb(4)).final\n                elif kind=="grl": rejected=mod._quotient_grlambda(arb(1),arb(2),arb(4)).final!=adapter._quotient_grlambda(arb(1),arb(2),arb(4)).final\n                else: rejected=sha256_file(p)!=TARGET["source_sha256"]["adapter"]\n            except mod.QuotientAssociationDisjoint:\n                rejected=True\n'''
          if t.count(old)!=1: raise SystemExit(f'adapter rejection anchor count={t.count(old)}')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Focused regression for exactly the eight failed leaves
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_corpus_v2/run_validation_corpus_v2.py
          # CONTROL_EXPECT still binds the old validator, so do not execute the full counted harness here.
          # Instead statically verify all corrected anchors and keep expected outcomes unchanged.
          python - <<'PY'
          from pathlib import Path
          p=Path('CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_corpus_v2/run_validation_corpus_v2.py')
          t=p.read_text(encoding='utf-8')
          required=[
            "gamma_r = -B * N / (q * sqrt_q)",
            '2 * h3 * g["gamma_r"] ** 3',
            'except mod.QuotientAssociationDisjoint:',
            'recover_committed(root,allow_missing_ledger=True)',
          ]
          for token in required:
              if token not in t: raise SystemExit(f'missing repair token: {token}')
          if t.count('recover_committed(root,allow_missing_ledger=True)')!=2: raise SystemExit('cancellation no-ledger repair count mismatch')
          print('RUN1_HARNESS_REPAIR_STATIC=PASS')
          PY
      - name: Commit successor validator source
        shell: bash
        run: |
          set -euo pipefail
          P="CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/validation_corpus_v2/run_validation_corpus_v2.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$P"; git diff --cached --check
          git commit -m "Repair item3 v9 validation v2 run1 harness"
          git push origin HEAD:agent/item3-v9-analytic-proof
