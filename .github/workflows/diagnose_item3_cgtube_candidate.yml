name: Diagnose item3 C-G-TUBE candidate (non-certifying)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose_item3_cgtube_candidate.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CG_TUBE_REPO_ROOT: ${{ github.workspace }}
  EXPECTED_SOURCE_HEAD: 12c2b648470014c74f30ca2c9e2b0411bddbc844

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: CERTIFICATES/prolate/item3_center_connection/c_g_tube
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: 12c2b648470014c74f30ca2c9e2b0411bddbc844
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install python-flint==0.9.0
      - name: Diagnostic provenance
        run: |
          set -e
          actual="$(git rev-parse HEAD)"
          echo "source_head=$actual"
          echo "expected_source_head=$EXPECTED_SOURCE_HEAD"
          test "$actual" = "$EXPECTED_SOURCE_HEAD"
          echo "config_sha256=$(sha256sum config.json | cut -d' ' -f1)"
          sha256sum "$CG_TUBE_REPO_ROOT"/CERTIFICATES/prolate/item2_circle/vendor/prolate_circle_F_cleanroom.py \
                    "$CG_TUBE_REPO_ROOT"/CERTIFICATES/prolate/item3_center_connection/vendor/prolate_circle_Frr_ext.py \
                    "$CG_TUBE_REPO_ROOT"/CERTIFICATES/prolate/item3_center_connection/calibration/item3_centered_calibration.json
      - name: Endpoint signs
        run: python3 c_g_tube_pilot.py --phase endpoints
      - name: 56 Taylor cells
        run: python3 c_g_tube_pilot.py --phase cells
      - name: Identity spots [0, 18, 37, 55]
        run: python3 c_g_tube_pilot.py --phase spots
      - name: Negative controls
        run: python3 run_controls.py
      - name: Checker diagnostic
        id: checker
        continue-on-error: true
        run: python3 c_g_tube_checker.py
      - name: Print diagnostic summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          here = Path('.')
          cfg = json.loads((here / 'config.json').read_text())
          def chain(name):
              p = here / name
              return [json.loads(x) for x in p.read_text().splitlines()] if p.exists() else []
          cells = chain('cells_chain.jsonl')
          uncert = [r['cell_index'] for r in cells if not r.get('certified', False)]
          terminal = {}
          for r in cells:
              bad = [s for s in r.get('sub', [])
                     if s.get('depth') == cfg['max_extra_depth'] and not s.get('negative', False)]
              if bad:
                  terminal[r['cell_index']] = [
                      {'a': s['a'], 'b': s['b'], 'G_prime_m': s['G_prime_m'],
                       'C_bound': s['C_bound']} for s in bad]
          print('UNCERTIFIED_CELLS=', json.dumps(uncert, separators=(',', ':')))
          print('TERMINAL_UNRESOLVED=', json.dumps(terminal, separators=(',', ':')))
          spots = chain('spots_chain.jsonl')
          for r in spots:
              print('SPOT=', json.dumps({
                  'cell_index': r.get('cell_index'),
                  'identity_negative': r.get('identity_negative'),
                  'taylor_negative': r.get('taylor_negative'),
                  'intersection_nonempty': r.get('intersection_nonempty'),
                  'Gprime_identity_ball': r.get('Gprime_identity_ball'),
                  'Gprime_taylor_ball': r.get('Gprime_taylor_ball'),
                  'intersection_ball': r.get('intersection_ball')
              }, separators=(',', ':')))
          for name in ('C_G_IDENTITY_CROSSCHECK.json', 'C_G_TUBE_PILOT.json',
                       'C_G_ENDPOINT_SIGNS.json', 'CONTROLS.json', 'DEPENDENCIES.json'):
              p = here / name
              if p.exists():
                  print(name + '=', p.read_text())
          PY
      - name: Upload diagnostic artifact
        if: always()
        id: diagnostic_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: item3-cgtube-diagnostic-${{ github.run_id }}
          path: CERTIFICATES/prolate/item3_center_connection/c_g_tube
          if-no-files-found: error
      - name: Diagnostic artifact digest
        if: always()
        working-directory: .
        run: echo "artifact_digest=${{ steps.diagnostic_artifact.outputs.artifact-digest }}"
