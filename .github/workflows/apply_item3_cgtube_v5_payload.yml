name: Apply item3 C-G-TUBE v5 payload

on:
  push:
    branches:
      - agent/prolate-item3-cgtube-source-candidate
    paths:
      - .github/workflows/apply_item3_cgtube_v5_payload.yml

permissions:
  contents: write

env:
  CG_TUBE_REPO_ROOT: ${{ github.workspace }}
  EXPECTED_BASE: 59d999c9b9af7d2d47a43ae1dd06eaf769f8fb1e
  EXPECTED_PAYLOAD_COMMIT: 26b25dd244b335f3c0b31dcd3c523cbb807a9418
  PAYLOAD_SHA256: 0e012f778d9e17258148130b24047ef6a9526ab264453cf25631d61bfad24692

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: agent/prolate-item3-cgtube-source-candidate
          fetch-depth: 3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify fixed ancestry and payload
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PAYLOAD_COMMIT"
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_BASE"
          base64 -d .github/payloads/item3_cgtube_v5_payload.b64 > /tmp/item3-cgtube-v5.tar.gz
          echo "$PAYLOAD_SHA256  /tmp/item3-cgtube-v5.tar.gz" | sha256sum -c -
      - name: Apply and validate v5 source
        run: |
          set -euo pipefail
          tar -xzf /tmp/item3-cgtube-v5.tar.gz -C .
          python -m py_compile \
            CERTIFICATES/prolate/item3_center_connection/c_g_tube/c_g_tube_pilot.py \
            CERTIFICATES/prolate/item3_center_connection/c_g_tube/c_g_tube_checker.py \
            CERTIFICATES/prolate/item3_center_connection/c_g_tube/run_controls.py
          pip install python-flint==0.9.0
          python CERTIFICATES/prolate/item3_center_connection/c_g_tube/run_controls.py
          rm -f CERTIFICATES/prolate/item3_center_connection/c_g_tube/CONTROLS.json
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            CERTIFICATES/prolate/item3_center_connection/c_g_tube/c_g_tube_checker.py \
            CERTIFICATES/prolate/item3_center_connection/c_g_tube/c_g_tube_pilot.py \
            CERTIFICATES/prolate/item3_center_connection/c_g_tube/config.json \
            CERTIFICATES/prolate/item3_center_connection/c_g_tube/run_controls.py | sort)"
          test "$actual" = "$expected"
          git diff --check
      - name: Commit v5 integration
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            CERTIFICATES/prolate/item3_center_connection/c_g_tube/c_g_tube_pilot.py \
            CERTIFICATES/prolate/item3_center_connection/c_g_tube/c_g_tube_checker.py \
            CERTIFICATES/prolate/item3_center_connection/c_g_tube/config.json \
            CERTIFICATES/prolate/item3_center_connection/c_g_tube/run_controls.py
          git commit -m "Integrate adaptive Taylor spot 18 crosscheck"
          git push origin HEAD:agent/prolate-item3-cgtube-source-candidate
