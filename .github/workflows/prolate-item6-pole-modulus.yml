name: Prolate item 6 pole modulus certificate

on:
  pull_request:
    paths:
      - ".github/workflows/prolate-item6-pole-modulus.yml"
      - "CERTIFICATES/prolate/item6_axis/prolate_axis_pole_modulus_symbolic_audit.py"
      - "CERTIFICATES/prolate/item6_axis/prolate_axis_pole_modulus_arb.py"
  workflow_dispatch:

concurrency:
  group: prolate-item6-pole-modulus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install audit and validated arithmetic
        run: python -m pip install sympy==1.14.0 python-flint==0.9.0
      - name: Verify pole modulus blow-up formulas
        working-directory: CERTIFICATES/prolate/item6_axis
        run: python prolate_axis_pole_modulus_symbolic_audit.py
      - name: Compile pole modulus driver
        working-directory: CERTIFICATES/prolate/item6_axis
        run: >-
          python -m py_compile
          prolate_axis_pole_modulus_symbolic_audit.py
          prolate_axis_pole_modulus_arb.py
      - name: Certify uniform pole modulus
        working-directory: CERTIFICATES/prolate/item6_axis
        run: >-
          python prolate_axis_pole_modulus_arb.py
          --dps 50
          --max-split-depth 18
          --max-boxes 65536
          --density-bound-limit 140000
          --json prolate_axis_pole_modulus.json
      - name: Upload pole modulus certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prolate-item6-pole-modulus
          path: |
            CERTIFICATES/prolate/item6_axis/prolate_axis_pole_modulus_symbolic_audit.json
            CERTIFICATES/prolate/item6_axis/prolate_axis_pole_modulus.json
            CERTIFICATES/prolate/item6_axis/prolate_axis_pole_modulus.json.sha256
