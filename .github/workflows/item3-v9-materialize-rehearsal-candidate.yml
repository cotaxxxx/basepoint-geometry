name: Item 3 v9 materialize rehearsal candidate

on:
  push:
    branches:
      - agent/item3-v9-analytic-proof
    paths:
      - ".github/workflows/item3-v9-materialize-rehearsal-candidate.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/item3-v9-analytic-proof
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify prerequisite audit gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate")
          required = [
              "dependency_builder_audit.json",
              "plan_config_builder_audit.json",
              "aggregate_verifier_v2_audit.json",
              "rehearsal_driver_v3_binding_audit.json",
              "static_audit_candidate_v2.json",
              "runtime_audit_candidate_v2.json",
              "runner_v2_structure_audit.json",
              "checker_v2_structure_audit.json",
              "checkpoint_transaction_audit.json",
              "checkpoint_bridge_v2_audit.json",
          ]
          for name in required:
              path = base / name
              obj = json.loads(path.read_text(encoding="utf-8"))
              if obj.get("status") != "PASSED":
                  raise SystemExit(f"prerequisite audit not PASSED: {name}: {obj.get('status')}")
          print("PREREQUISITE_AUDITS=PASSED")
          PY

      - name: Materialize canonical candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          BASE="CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate"
          OUT="$BASE/rehearsal_bundle_candidate_v1"
          DEPS="$OUT/dependencies"
          PLAN="$OUT/plan_config"

          if [ -e "$OUT" ]; then
            echo "candidate bundle path already exists: $OUT" >&2
            exit 1
          fi

          python "$BASE/build_dependency_snapshot_v9.py" \
            --repo-root . \
            --output-dir "$DEPS"

          python "$BASE/build_rehearsal_plan_config_v9.py" \
            --repo-root . \
            --dependency-snapshot "$DEPS/dependency_snapshot_v9_candidate.json" \
            --output-dir "$PLAN"

      - name: Verify generated bytes and parser acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import sys
          from pathlib import Path

          root = Path.cwd()
          base = root / "CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate"
          out = base / "rehearsal_bundle_candidate_v1"
          deps = out / "dependencies"
          plan_dir = out / "plan_config"

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def canonical(path: Path) -> None:
              raw = path.read_bytes()
              if not raw.endswith(b"\n"):
                  raise SystemExit(f"missing final LF: {path}")
              obj = json.loads(raw.decode("utf-8"))
              expected = (json.dumps(obj, sort_keys=True, separators=(",", ":"), ensure_ascii=False) + "\n").encode("utf-8")
              if raw != expected:
                  raise SystemExit(f"noncanonical JSON: {path}")

          for path in list(deps.glob("*.json")) + list(plan_dir.glob("*.json")):
              canonical(path)

          dep_snapshot = deps / "dependency_snapshot_v9_candidate.json"
          plan_path = plan_dir / "rehearsal_plan_v2.json"
          config_path = plan_dir / "rehearsal_shard_config_v1.json"

          for data_path, sha_path in [
              (dep_snapshot, deps / "dependency_snapshot_v9_candidate.json.sha256"),
              (plan_path, plan_dir / "rehearsal_plan_v2.json.sha256"),
              (config_path, plan_dir / "rehearsal_shard_config_v1.json.sha256"),
          ]:
              expected = sha_path.read_text(encoding="ascii").strip()
              observed = sha(data_path)
              if expected != observed:
                  raise SystemExit(f"sha file mismatch: {data_path.name}: {expected} != {observed}")

          def load_module(name: str, path: Path):
              spec = importlib.util.spec_from_file_location(name, path)
              if spec is None or spec.loader is None:
                  raise SystemExit(f"cannot load {path}")
              mod = importlib.util.module_from_spec(spec)
              sys.modules[name] = mod
              spec.loader.exec_module(mod)
              return mod

          agg = load_module("agg_v9_materialize", base / "aggregate_verifier_v9_candidate_v2.py")
          drv = load_module("driver_v9_materialize", base / "rehearsal_driver_v9_candidate_v3.py")

          parsed_plan = agg.parse_plan(plan_path)
          if len(parsed_plan.ordered_shards) != 1:
              raise SystemExit("rehearsal plan is not exactly one shard")
          config_obj, observed_config_sha = agg.parse_config_for_plan(
              config_path, parsed_plan, parsed_plan.ordered_shards[0]
          )
          driver_config = drv.parse_config(config_path)

          if observed_config_sha != sha(config_path):
              raise SystemExit("aggregate parser config SHA mismatch")
          if driver_config.aggregate_plan_sha256 != sha(plan_path):
              raise SystemExit("driver plan SHA binding mismatch")
          if driver_config.dependency_snapshot_sha256 != sha(dep_snapshot):
              raise SystemExit("driver dependency SHA binding mismatch")
          if set(config_obj["source_sha256"]) != {
              "kernel", "adapter", "runner", "checker", "checkpoint", "bridge", "driver", "aggregate_verifier"
          }:
              raise SystemExit("config source map is not exact eight-key set")

          print("GENERATED_BYTES=CANONICAL")
          print("PLAN_CONFIG_PARSERS=PASS")
          PY

      - name: Write materialization report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          base = root / "CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate"
          out = base / "rehearsal_bundle_candidate_v1"
          deps = out / "dependencies"
          plan = out / "plan_config"

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          report = {
              "authorization": "MATERIALIZATION_ONLY",
              "certified_lambda_range": False,
              "config_sha256": sha(plan / "rehearsal_shard_config_v1.json"),
              "dependency_snapshot_sha256": sha(deps / "dependency_snapshot_v9_candidate.json"),
              "entry_count": 8,
              "freeze_authorized": False,
              "materialized_from_commit": head,
              "plan_sha256": sha(plan / "rehearsal_plan_v2.json"),
              "production_rehearsal_authorized": False,
              "schema": "ITEM3_SWEEP_V9_REHEARSAL_BUNDLE_MATERIALIZATION_V1",
              "status": "MATERIALIZED_CANDIDATE",
              "tag_created": False,
          }
          data = (json.dumps(report, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          (out / "MATERIALIZATION_REPORT.json").write_bytes(data)
          print(data.decode("utf-8"), end="")
          PY

      - name: Commit candidate bundle atomically
        shell: bash
        run: |
          set -euo pipefail
          OUT="CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/rehearsal_bundle_candidate_v1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUT"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "no candidate materialization changes" >&2
            exit 1
          fi
          git commit -m "Materialize item3 v9 rehearsal candidate bundle"
          git push origin HEAD:agent/item3-v9-analytic-proof
