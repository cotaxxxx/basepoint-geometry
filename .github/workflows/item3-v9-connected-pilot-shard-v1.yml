name: Item 3 v9 connected-pilot shard v1

on:
  workflow_dispatch:
    inputs:
      shard_index:
        description: Exact frozen shard index
        required: true
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"

permissions:
  contents: write

concurrency:
  group: item3-v9-connected-pilot-shard-v1-${{ inputs.shard_index }}
  cancel-in-progress: false

env:
  BASE: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate
  IDBASE: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/connected_pilot_identity_v1
  FREEZE_BASE: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/connected_pilot_identity_v1/freeze_v1
  MANIFEST: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/connected_pilot_identity_v1/qualification_manifest_v1/QUALIFICATION_MANIFEST.json
  PLAN: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/connected_pilot_identity_v1/plan_config/connected_pilot_plan_v2.json
  PACKAGE_BASE: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/connected_pilot_v1
  FROZEN_COMMIT: 9c98d2ab5f7df7825162e76e5380caaae46e4a2f
  PLAN_SHA256: aba9b2d1571cdc7c9aa7c4520233cafe7d7690f45bbcd7bbf7068339c78d67a9
  MANIFEST_SHA256: 56b5cddb2791d5547dd08615d609ccdf3847c3c1df419426e2caac5f9bd40a83
  COMPANION_SHA256: 0e81899add6ad773eb08e2bc29e7519b55bc580022f54573d5e791ccef718a2a

jobs:
  shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"

      - name: Install pinned validated arithmetic
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0

      - name: Select exact frozen shard identity
        env:
          SHARD: ${{ inputs.shard_index }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SHARD" in
            0)
              CONFIG_SHA=f3838d1c49f917e19fabfdb8c991dd5040128f81aadd58a930218dceecef2b03
              RECEIPT_SHA=dd95ef88e693c141cdf992addb7e288effc498d022d7c8d5332587e5ba89a8dc
              ;;
            1)
              CONFIG_SHA=2c1a612c1d32c5675af92dd0fad2c07b4af18b0bab370e62d44a68a8d44d0f41
              RECEIPT_SHA=e0fe7e31fed5714ef4c1605976e8285e2196a960bef6978e67bfcedfe6f09524
              ;;
            2)
              CONFIG_SHA=32214842510f63cdf781dac4f145d5d4a46942b1194d9386717cdba1a4c95002
              RECEIPT_SHA=1d0f47982cd489f36267479441ade3f112e1493dc0cd53972273dc5765644d62
              ;;
            3)
              CONFIG_SHA=36bd40c39c722805f3742b3a9e8f562e2c39deca07c4f27666f54a88bf6e7ebe
              RECEIPT_SHA=18694837519ac9e4bcaac4566643d7e4cba5dedb0516342dc4178553909315ee
              ;;
            *) echo "invalid shard_index" >&2; exit 2 ;;
          esac
          echo "SHARD=$SHARD" >> "$GITHUB_ENV"
          echo "CONFIG=$IDBASE/plan_config/shard_${SHARD}_config_v1.json" >> "$GITHUB_ENV"
          echo "CONFIG_SHA256=$CONFIG_SHA" >> "$GITHUB_ENV"
          echo "RECEIPT=$FREEZE_BASE/shard_${SHARD}/FREEZE_RECEIPT.json" >> "$GITHUB_ENV"
          echo "RECEIPT_SHA256=$RECEIPT_SHA" >> "$GITHUB_ENV"
          echo "PACKAGE=$PACKAGE_BASE/shard_${SHARD}" >> "$GITHUB_ENV"

      - name: Fail-closed frozen identity preflight
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          printf '%s\n' "$actual_head" > ACTUAL_HEAD.txt
          git merge-base --is-ancestor "$FROZEN_COMMIT" HEAD
          python - <<'PY'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          import flint

          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def require(p,h,label):
              observed=sha(p)
              if observed!=h: raise SystemExit(f'{label} drift: {observed} != {h}')

          require(os.environ['PLAN'],os.environ['PLAN_SHA256'],'plan')
          require(os.environ['CONFIG'],os.environ['CONFIG_SHA256'],'config')
          require(os.environ['RECEIPT'],os.environ['RECEIPT_SHA256'],'receipt')
          require(os.environ['MANIFEST'],os.environ['MANIFEST_SHA256'],'manifest')
          companion=Path(os.environ['FREEZE_BASE'])/'FREEZE_AUTHORIZATION_COMPANION_2026-08-09.json'
          require(companion,os.environ['COMPANION_SHA256'],'companion')

          manifest=json.loads(Path(os.environ['MANIFEST']).read_text(encoding='utf-8'))
          arts=manifest.get('artifacts')
          if not isinstance(arts,list) or len(arts)!=24: raise SystemExit('qualification manifest must contain exactly 24 referents')
          seen=set()
          for e in arts:
              if not isinstance(e,dict) or set(e)!={'path','sha256'}: raise SystemExit('manifest entry field set mismatch')
              if e['path'] in seen: raise SystemExit('duplicate manifest referent')
              seen.add(e['path']); require(e['path'],e['sha256'],f"manifest referent {e['path']}")

          receipt=json.loads(Path(os.environ['RECEIPT']).read_text(encoding='utf-8'))
          if set(receipt)!={'aggregate_plan_sha256','config_sha256','dependency_snapshot_sha256','design_sha256','freeze_verdict','nonclaims','performance_gate_report_sha256','qualification_manifest_sha256','schema','source_sha256','validation_report_sha256'}: raise SystemExit('receipt field set mismatch')
          if receipt['schema']!='ITEM3_SWEEP_V9_FREEZE_RECEIPT_V1' or receipt['freeze_verdict']!='V9_FROZEN_APPROVED': raise SystemExit('receipt contract mismatch')
          if receipt['config_sha256']!=os.environ['CONFIG_SHA256'] or receipt['aggregate_plan_sha256']!=os.environ['PLAN_SHA256'] or receipt['qualification_manifest_sha256']!=os.environ['MANIFEST_SHA256']: raise SystemExit('receipt binding mismatch')

          if platform.python_version()!='3.13.14': raise SystemExit('Python mismatch')
          if getattr(flint,'__version__',None)!='0.9.0': raise SystemExit('python-flint mismatch')
          if getattr(flint,'__FLINT_VERSION__',None)!='3.6.0': raise SystemExit('FLINT mismatch')

          report={'schema':'ITEM3_SWEEP_V9_CONNECTED_PILOT_PREFLIGHT_V1','status':'PASS','shard_index':int(os.environ['SHARD']),'actual_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'frozen_commit_ancestor':True,'manifest_referent_count':24,'manifest_referents_verified':True,'config_sha256':os.environ['CONFIG_SHA256'],'freeze_receipt_sha256':os.environ['RECEIPT_SHA256'],'plan_sha256':os.environ['PLAN_SHA256'],'python':platform.python_version(),'python_flint':getattr(flint,'__version__','UNKNOWN'),'flint_library':getattr(flint,'__FLINT_VERSION__','UNKNOWN')}
          Path('PREFLIGHT.json').write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Record environment identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pilot-work/wheel
          python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps python-flint==0.9.0 -d pilot-work/wheel >/dev/null
          python - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          import flint
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          wheel=next(Path('pilot-work/wheel').glob('python_flint-*.whl'))
          obj={'schema':'ITEM3_SWEEP_V9_CONNECTED_PILOT_ENVIRONMENT_V1','shard_index':int(os.environ['SHARD']),'github_sha':os.environ.get('GITHUB_SHA'),'github_run_id':os.environ.get('GITHUB_RUN_ID'),'github_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'runner_name':os.environ.get('RUNNER_NAME'),'runner_os':os.environ.get('RUNNER_OS'),'runner_arch':os.environ.get('RUNNER_ARCH'),'python':platform.python_version(),'python_flint':getattr(flint,'__version__','UNKNOWN'),'flint_library':getattr(flint,'__FLINT_VERSION__','UNKNOWN'),'python_flint_wheel':wheel.name,'python_flint_wheel_sha256':sha(wheel),'config_sha256':os.environ['CONFIG_SHA256'],'plan_sha256':os.environ['PLAN_SHA256'],'freeze_receipt_sha256':os.environ['RECEIPT_SHA256'],'qualification_manifest_sha256':os.environ['MANIFEST_SHA256'],'tag_created':False,'certified_lambda_range':False,'connected_sweep_authorized':False}
          Path('pilot-work/ENVIRONMENT.json').write_text(json.dumps(obj,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Execute frozen production shard
        shell: bash
        run: |
          set -uo pipefail
          OUT="pilot-work/output"
          mkdir -p "$OUT"
          start_ns=$(date +%s%N)
          set +e
          timeout --signal=TERM --kill-after=5m 270m \
            python "$BASE/rehearsal_driver_v9_candidate_v3.py" \
              --checkout-root . \
              --config "$CONFIG" \
              --freeze-receipt "$RECEIPT" \
              --output-dir "$OUT" \
              > pilot-work/DRIVER_STDOUT.log 2> pilot-work/DRIVER_STDERR.log
          rc=$?
          set -e
          end_ns=$(date +%s%N)
          printf '%s\n' "$rc" > pilot-work/DRIVER_EXIT_CODE.txt
          printf '%s\n' "$start_ns" > pilot-work/START_NS.txt
          printf '%s\n' "$end_ns" > pilot-work/END_NS.txt

      - name: Build additive shard package
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -e "$PACKAGE" ]; then echo "Refusing to modify existing shard package" >&2; exit 1; fi
          mkdir -p "$PACKAGE"
          cp PREFLIGHT.json "$PACKAGE/" 2>/dev/null || true
          cp pilot-work/ENVIRONMENT.json "$PACKAGE/" 2>/dev/null || true
          cp pilot-work/DRIVER_EXIT_CODE.txt "$PACKAGE/" 2>/dev/null || true
          cp pilot-work/DRIVER_STDOUT.log "$PACKAGE/" 2>/dev/null || true
          cp pilot-work/DRIVER_STDERR.log "$PACKAGE/" 2>/dev/null || true
          cp pilot-work/START_NS.txt "$PACKAGE/" 2>/dev/null || true
          cp pilot-work/END_NS.txt "$PACKAGE/" 2>/dev/null || true
          if [ -d pilot-work/output ]; then cp -a pilot-work/output/. "$PACKAGE/"; fi
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          pkg=Path(os.environ['PACKAGE']); rc_path=pkg/'DRIVER_EXIT_CODE.txt'
          rc=int(rc_path.read_text().strip()) if rc_path.is_file() else None
          status={'schema':'ITEM3_SWEEP_V9_CONNECTED_PILOT_SHARD_STATUS_V1','status':'MACHINE_PASS_PENDING_AGGREGATION' if rc==0 else 'FAILED','shard_index':int(os.environ['SHARD']),'driver_exit_code':rc,'freeze_receipt_sha256':os.environ['RECEIPT_SHA256'],'config_sha256':os.environ['CONFIG_SHA256'],'certified_lambda_range':False,'tag_created':False,'connected_sweep_authorized':False,'promotion_pending_audit':True}
          (pkg/'SHARD_STATUS.json').write_text(json.dumps(status,sort_keys=True,separators=(',',':'))+'\n')
          hashes={}
          for p in sorted(pkg.rglob('*')):
              if p.is_file() and p.name!='PACKAGE_HASHES.json': hashes[str(p.relative_to(pkg))]=hashlib.sha256(p.read_bytes()).hexdigest()
          (pkg/'PACKAGE_HASHES.json').write_text(json.dumps({'schema':'ITEM3_SWEEP_V9_CONNECTED_PILOT_SHARD_PACKAGE_HASHES_V1','files':hashes},sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: item3-v9-connected-pilot-shard-${{ inputs.shard_index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pilot-work/
            ${{ env.PACKAGE_BASE }}/shard_${{ inputs.shard_index }}/

      - name: Commit shard package additively
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d "$PACKAGE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PACKAGE"
          git diff --cached --check
          git diff --cached --name-only | awk -v p="$PACKAGE/" 'index($0,p)!=1 {bad=1} END {exit bad}'
          git commit -m "Record item3 v9 connected-pilot shard ${SHARD}"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/item3-v9-analytic-proof
            if git rebase origin/agent/item3-v9-analytic-proof && git push origin HEAD:agent/item3-v9-analytic-proof; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*5))
          done
          echo "Failed to publish additive shard package after retries" >&2
          exit 1

      - name: Enforce shard machine completion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PACKAGE/DRIVER_EXIT_CODE.txt"
          test "$(cat "$PACKAGE/DRIVER_EXIT_CODE.txt")" = "0"
          python - <<'PY'
          import json,os
          from pathlib import Path
          pkg=Path(os.environ['PACKAGE'])
          ev=pkg/'SHARD_EVIDENCE_CANDIDATE.json'; prov=pkg/'SHARD_PROVENANCE.json'
          if not ev.is_file() or not prov.is_file(): raise SystemExit('missing shard evidence/provenance')
          e=json.loads(ev.read_text()); p=json.loads(prov.read_text())
          if e.get('authorization')!='FROZEN_PRODUCTION' or p.get('authorization')!='FROZEN_PRODUCTION': raise SystemExit('authorization mismatch')
          if e.get('freeze_receipt_sha256')!=os.environ['RECEIPT_SHA256'] or p.get('freeze_receipt_sha256')!=os.environ['RECEIPT_SHA256']: raise SystemExit('receipt propagation mismatch')
          PY
