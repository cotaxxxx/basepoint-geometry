              micro_ok=len(grouped)==10 and all(len(v)==9 for v in grouped.values())
              identity=all(e['config_sha256']==config_shas[shard] and e['aggregate_plan_sha256']=='aba9b2d1571cdc7c9aa7c4520233cafe7d7690f45bbcd7bbf7068339c78d67a9' and e['dependency_snapshot_sha256']=='ee033ab46b844168887a6e2e1f5a2b97cc460d1b43bbafd77be49897127950aa' and e['validation_report_sha256']=='25e34aa51fe935d544e967d97c181ad8e21b59220e7d0d75eb22628a191f85cb' and e['python']=='3.13.14' and e['python_flint']=='0.9.0' and e['flint_library']=='3.6.0' and e['design_sha256']=='1f5666692cae73c1442e281fb8feab1da95fd58ac6988ad65ac229fd6fdf91ef' for e in envs) and len({e['workflow_sha256'] for e in envs})==1 and len({json.dumps(e['source_sha256'],sort_keys=True) for e in envs})==1 and len({e['python_flint_wheel_sha256'] for e in envs})==1
              passed=all([exactly_three,hard,margin,overhead,mathematical,fresh,cancellation.get('status')=='PASSED',micro_ok,finite,identity])
              sdir=out/f'shard_{shard}'; sdir.mkdir()
              report={'schema':'ITEM3_SWEEP_V9_CONNECTED_PERFORMANCE_GATE_REPORT_V1','shard_index':shard,'status':'PASSED' if passed else 'PERFORMANCE_GATE_FAIL','authorization':'QUALIFICATION_ONLY','config_sha256':config_shas[shard],'plan_sha256':'aba9b2d1571cdc7c9aa7c4520233cafe7d7690f45bbcd7bbf7068339c78d67a9','dependency_snapshot_sha256':'ee033ab46b844168887a6e2e1f5a2b97cc460d1b43bbafd77be49897127950aa','validation_report_sha256':'25e34aa51fe935d544e967d97c181ad8e21b59220e7d0d75eb22628a191f85cb','counted_repetition_count':len(times),'required_repetition_count':3,'complete_path_wall_seconds':times,'median_complete_path_wall_seconds':median,'maximum_complete_path_wall_seconds':maximum,'hard_three_hour_gate':hard,'median_2h30_gate':bool(median is not None and median<=9000),'maximum_2h45_gate':bool(maximum is not None and maximum<=9900),'checkpoint_overhead_gate':overhead,'mathematical_completion_gate':mathematical,'fresh_checker_gate':fresh,'cancellation_recovery_gate':cancellation.get('status')=='PASSED','microbenchmark_nine_sample_gate':micro_ok,'microbenchmark_all_finite':finite,'identity_stable':identity,'tag_created':False,'freeze_authorized':False,'production_rehearsal_authorized':False,'certified_lambda_range':False}
              (sdir/'PERFORMANCE_GATE_REPORT.json').write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n')
              (sdir/'REPETITIONS.json').write_text(json.dumps({'schema':'ITEM3_SWEEP_V9_CONNECTED_REPETITIONS_V1','runs':reps},sort_keys=True,separators=(',',':'))+'\n')
