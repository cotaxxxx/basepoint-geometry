          config_shas=['f3838d1c49f917e19fabfdb8c991dd5040128f81aadd58a930218dceecef2b03','2c1a612c1d32c5675af92dd0fad2c07b4af18b0bab370e62d44a68a8d44d0f41','32214842510f63cdf781dac4f145d5d4a46942b1194d9386717cdba1a4c95002','36bd40c39c722805f3742b3a9e8f562e2c39deca07c4f27666f54a88bf6e7ebe']
          summary=[]
          for shard in range(4):
              reps=[]; envs=[]; micro=[]; algs=[]; cps=[]; mv=[]
              for rep in (1,2,3):
                  d=root/'reps'/f'item3-v9-connected-qualification-s{shard}-rep-{rep}'
                  reps.append(json.loads((d/'REPETITION_REPORT.json').read_text())); envs.append(json.loads((d/'PERFORMANCE_ENVIRONMENT.json').read_text())); algs.append(json.loads((d/'ALGORITHM_PERFORMANCE.json').read_text())); cps.append(json.loads((d/'CHECKPOINT_OVERHEAD.json').read_text()))
                  micro += [json.loads(x) for x in (d/'KERNEL_MICROBENCHMARK.jsonl').read_text().splitlines() if x]; mv += [json.loads(x) for x in (d/'MEAN_VALUE_COMPONENTS.jsonl').read_text().splitlines() if x]
              cdir=root/'cancellation'/f'item3-v9-connected-cancellation-s{shard}'; cancellation=json.loads((cdir/'CANCELLATION_RECOVERY.json').read_text())
              times=[float(r['complete_path_wall_seconds']) for r in reps if r.get('counted_success')]; exactly_three=len(times)==3; median=statistics.median(times) if times else None; maximum=max(times) if times else None
              hard=exactly_three and all(t<10800 for t in times); margin=exactly_three and median<=9000 and maximum<=9900
