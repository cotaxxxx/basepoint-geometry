              (sdir/'ALGORITHM_PERFORMANCE.json').write_text(json.dumps({'schema':'ITEM3_SWEEP_V9_CONNECTED_ALGORITHM_PERFORMANCE_V1','runs':algs},sort_keys=True,separators=(',',':'))+'\n')
              (sdir/'CHECKPOINT_OVERHEAD.json').write_text(json.dumps({'schema':'ITEM3_SWEEP_V9_CONNECTED_CHECKPOINT_OVERHEAD_V1','runs':cps},sort_keys=True,separators=(',',':'))+'\n')
              (sdir/'CANCELLATION_RECOVERY.json').write_text(json.dumps(cancellation,sort_keys=True,separators=(',',':'))+'\n')
              with (sdir/'KERNEL_MICROBENCHMARK.jsonl').open('w') as f:
