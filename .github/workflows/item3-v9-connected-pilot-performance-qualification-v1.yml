          all_pass=all(x['status']=='PASSED' for x in summary)
          top={'schema':'ITEM3_SWEEP_V9_CONNECTED_QUALIFICATION_INDEX_V1','status':'PASSED' if all_pass else 'QUALIFICATION_FAIL','plan_sha256':'aba9b2d1571cdc7c9aa7c4520233cafe7d7690f45bbcd7bbf7068339c78d67a9','validation_report_sha256':'25e34aa51fe935d544e967d97c181ad8e21b59220e7d0d75eb22628a191f85cb','shards':summary,'counted_repetition_total':12 if all_pass else sum(3 for x in summary if x['status']=='PASSED'),'tag_created':False,'freeze_authorized':False,'certified_lambda_range':False}
          (out/'QUALIFICATION_INDEX.json').write_text(json.dumps(top,sort_keys=True,separators=(',',':'))+'\n'); print(json.dumps(top,indent=2,sort_keys=True))
