name: Item 3 v9 checkpoint hash-separation repair

on:
  push:
    branches:
      - agent/item3-v9-analytic-proof
    paths:
      - ".github/workflows/item3-v9-checkpoint-hash-separation-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/item3-v9-analytic-proof
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"

      - name: Apply checkpoint provenance separation repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          base = Path("CERTIFICATES/prolate/item3_center_connection/lambda_sweep")
          cand = base / "v9_candidate"
          draft = base / "v9_draft"

          # ------------------------------------------------------------------
          # 1. Integrated contract: mathematical shard evidence and checkpoint
          #    provenance are separate canonical objects.  The selected chain
          #    hashes only mathematical shard evidence bytes.
          # ------------------------------------------------------------------
          contract = draft / "design_contract_v9_integrated_candidate_v2.md"
          text = contract.read_text(encoding="utf-8")
          old = "schema = ITEM3_SWEEP_V9_SHARD_EVIDENCE_CANDIDATE_V1."
          if text.count(old) != 1:
              raise SystemExit(f"contract evidence-schema anchor count={text.count(old)}")
          text = text.replace(old, "schema = ITEM3_SWEEP_V9_SHARD_EVIDENCE_CANDIDATE_V2.", 1)

          old = "- checker report including dps70 leaf bounds;\n- committed-checkpoint provenance;\n- explicit errors if any."
          new = (
              "- checker report including dps70 leaf bounds;\n"
              "- explicit errors if any.\n\n"
              "Checkpoint history is deliberately excluded from this mathematical evidence object. "
              "The driver writes a separate canonical `ITEM3_SWEEP_V9_SHARD_PROVENANCE_V1` object "
              "bound to the exact shard-evidence SHA-256.  That provenance object records the "
              "committed-checkpoint count/tip and ledger identity, while the aggregate verifier "
              "independently revalidates the canonical JSONL chain and immutable payload hashes. "
              "No checkpoint count, checkpoint hash, checkpoint timing value, provenance-object hash, "
              "or ledger hash enters `shard_evidence_sha256` or the selected-shard mathematical chain."
          )
          if text.count(old) != 1:
              raise SystemExit(f"contract provenance bullet anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = "11. nonempty committed checkpoint provenance for each complete shard;"
          new = (
              "11. a separate shard-provenance object bound to the selected shard-evidence hash, "
              "with a nonempty checkpoint ledger whose canonical line chain, immutable payload hashes, "
              "frontier digests and run-context bindings are independently reverified;"
          )
          if text.count(old) != 1:
              raise SystemExit(f"contract aggregate provenance anchor count={text.count(old)}")
          text = text.replace(old, new, 1)
          contract.write_text(text, encoding="utf-8")

          # ------------------------------------------------------------------
          # 2. Aggregate verifier: V2 mathematical evidence excludes checkpoint
          #    fields; provenance is verified independently and never added to
          #    selected evidence hashes or the aggregate verdict.
          # ------------------------------------------------------------------
          agg = cand / "aggregate_verifier_v9_candidate_v2.py"
          text = agg.read_text(encoding="utf-8")
          old = 'EVIDENCE_SCHEMA = "ITEM3_SWEEP_V9_SHARD_EVIDENCE_CANDIDATE_V1"\n'
          new = (
              'EVIDENCE_SCHEMA = "ITEM3_SWEEP_V9_SHARD_EVIDENCE_CANDIDATE_V2"\n'
              'PROVENANCE_SCHEMA = "ITEM3_SWEEP_V9_SHARD_PROVENANCE_V1"\n'
