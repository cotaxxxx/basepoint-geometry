name: Item 3 v9 checkpoint hash-separation repair

on:
  push:
    branches:
      - agent/item3-v9-analytic-proof
    paths:
      - ".github/workflows/item3-v9-checkpoint-hash-separation-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/item3-v9-analytic-proof
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"

      - name: Install pinned validated arithmetic
        run: python -m pip install python-flint==0.9.0

      - name: Apply repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/item3_v9_checkpoint_hash_separation_repair.py')
          t=p.read_text(encoding='utf-8')
          old='old = "schema = ITEM3_SWEEP_V9_SHARD_EVIDENCE_CANDIDATE_V1."'
          new='old = "ITEM3_SWEEP_V9_SHARD_EVIDENCE_CANDIDATE_V1."'
          if t.count(old)!=1: raise SystemExit(f'old contract anchor source count={t.count(old)}')
          t=t.replace(old,new,1)
          old='text = text.replace(old, "schema = ITEM3_SWEEP_V9_SHARD_EVIDENCE_CANDIDATE_V2.", 1)'
          new='text = text.replace(old, "ITEM3_SWEEP_V9_SHARD_EVIDENCE_CANDIDATE_V2.", 1)'
          if t.count(old)!=1: raise SystemExit(f'new contract anchor source count={t.count(old)}')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          python .github/scripts/item3_v9_checkpoint_hash_separation_repair.py

          # The legacy test mutates mathematical evidence and then reuses provenance
          # bound to the old evidence hash. Rebind provenance to the deliberately
          # mutated evidence so this test continues to isolate the selected-chain
          # dependence on mathematical evidence bytes.
          python - <<'PY'
          from pathlib import Path
          p=Path('CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/test_aggregate_verifier_v9_candidate_v2.py')
          t=p.read_text(encoding='utf-8')
          old='''            obj["nonclaim"] = "same proof fields, changed evidence bytes"\n            canonical_write(paths[3][0], obj)\n            second = a.verify_aggregate(\n'''
          new='''            obj["nonclaim"] = "same proof fields, changed evidence bytes"\n            evidence_sha = canonical_write(paths[3][0], obj)\n            provenance_obj = json.loads(paths[4][0].read_text(encoding="utf-8"))\n            paths[4][0] = write_provenance_fixture(\n                root, plan=one_shard_plan(),\n                plan_sha=provenance_obj["aggregate_plan_sha256"], shard_index=0,\n                config_sha=provenance_obj["config_sha256"],\n                receipt_sha=provenance_obj["freeze_receipt_sha256"],\n                evidence_sha=evidence_sha,\n                record_count=provenance_obj["checkpoint_commit_count"],\n            )\n            second = a.verify_aggregate(\n'''
          if t.count(old)!=1:
              raise SystemExit(f'selected-chain test anchor count={t.count(old)}')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY

      - name: Run focused structural controls
        working-directory: CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            aggregate_verifier_v9_candidate_v2.py \
            rehearsal_driver_v9_candidate_v3.py \
            test_aggregate_verifier_v9_candidate_v2.py \
            test_rehearsal_driver_v3_binding.py
          python -m unittest -v \
            test_aggregate_verifier_v9_candidate_v2.py \
            test_rehearsal_driver_v3_binding.py

      - name: Promote focused repair receipt status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_draft/CHECKPOINT_HASH_SEPARATION_REPAIR_RECEIPT_2026-08-08.md")
          text=p.read_text(encoding="utf-8")
          old="Status: **BLOCKER 1 REPAIR CANDIDATE / FOCUSED TESTS REQUIRED / FREEZE NOT AUTHORIZED**"
          new="Status: **BLOCKER 1 FOCUSED CONTROLS PASS / FULL REQUALIFICATION REQUIRED / FREEZE NOT AUTHORIZED**"
          if text.count(old)!=1:
              raise SystemExit("receipt status anchor mismatch")
          p.write_text(text.replace(old,new,1),encoding="utf-8")
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_draft/design_contract_v9_integrated_candidate_v2.md \
            CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_draft/CHECKPOINT_HASH_SEPARATION_REPAIR_RECEIPT_2026-08-08.md \
            CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/aggregate_verifier_v9_candidate_v2.py \
            CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/rehearsal_driver_v9_candidate_v3.py \
            CERTIFICATES/prolate/item3_center_connection/lambda_sweep/v9_candidate/test_aggregate_verifier_v9_candidate_v2.py
          git diff --cached --check
          git commit -m "Separate v9 checkpoint provenance from proof hashes"
          git push origin HEAD:agent/item3-v9-analytic-proof
